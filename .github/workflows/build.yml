## 5. 操作流程（设备端）

**A. 清除监管**

```
0. 打开飞行模式（阻断 MDM check-in，避免删完立刻被推回来）
1. 安装并打开「监管开关」
2. 顶部填 App Group（应与签名一致）→ 保存
3. ① 自检        → 应看到 "ConfigurationProfiles: 扩展已取得（逃逸可用）"
4. ② 检测监管状态 → 显示 IsSupervised / OrganizationName / MDM ServerURL，确认设备确实是监管设备
5. ③ 备份         → 备份写到 App 的 Documents/backups/<时间戳>/（可用「文件」App 导出）
6. ⑧ 记录快照     → 名字填「基线」，后面用来和清除后对照
7. ④ 彻底清除     → 删除监管与 MDM 落盘状态
8. 关机重启（保持飞行模式）
9. 设置 → 通用 → VPN 与设备管理：MDM 描述文件应消失；设置首页不应再有“此 iPhone 受监管”
10. 再关闭飞行模式联网验证；若监管被推回，说明是 ABM/DEP 注册设备（见第 7 节）
```

**B. 开启监管（测试闭环）**

```
0. 无需飞行模式（纯本机状态位）
1. ⑧ 记录状态快照 → 名字填「基线」
2. 在“开启监管参数”里填组织名 / 邮箱 / ConfigurationURL，按需打开 MDM.plist 占位开关
3. ⑦ 开启监管 → 确认弹窗里核对参数 → 写入并读回校验
4. ⑧ 再记录一份「开启后」→ ⑨ 对比快照链，应看到 + CloudConfigurationDetails.plist 与 IsSupervised: (无) → 1
5. 重启设备：设置首页出现“此 iPhone 受监管”，② 检测显示 IsSupervised = 1
6. 测完点 ④ 彻底清除 → ⑧ 记一份「清除后」→ 再重启，回到普通设备
7. ⑨ 对比快照链，逐对 diff 能完整看到「基线 → 开启后 → 清除后 → 当前」的字段轨迹
```

开启前也可以先 ③ 备份，这样“开启 → 清除 → 回滚”三条状态都能互相对照。

“⑤ 温和补丁”是另一条路：不删文件，只把 `IsSupervised` / `IsMandatory` 降为 `false`、`MDM.plist` 的 `ServerURL`/`CheckInURL` 指向 `https://127.0.0.1:1/`、`SignMessage=false`、清空 `MDMAppManagement.metadataByBundleID` 和 `PayloadManifest.OrderedProfiles`。适合“只想解除限制、不想让管理端发现设备掉线”的场景。

---

## 5.1 快照与 diff（验证落盘效果）

点 **⑧ 记录状态快照**，起个名字（`基线` / `开启后` / `清除后`），App 会把当前状态写进 `Documents/snapshots/<时间戳>-<名字>.plist`，采集内容：

| 采集项 | 说明 |
|---|---|
| 三处目录条目 | `ConfigurationProfiles` / `DeviceManagement` / 用户 profile 目录：文件名、大小、是否目录 |
| `cloud.*` | `CloudConfigurationDetails.plist` 里的 8 个键（IsSupervised、IsMandatory、IsMDMUnremovable、IsMultiUser、ConfigurationWasApplied、OrganizationName、OrganizationEmail、ConfigurationURL） |
| `mdm.*` | `MDM.plist` 的 ServerURL / CheckInURL / Topic / SignMessage |
| `clientTruth.*` | `DeviceManagement/ClientTruth.plist` 里 `CloudConfiguration` 子字典的 3 个键 |
| `orderedProfiles` | `PayloadManifest.OrderedProfiles` 的条目数 |

点 **⑨ 对比快照链**：按时间顺序逐对 diff，最后再和**当前实时状态**比一次。典型输出：

```text
共 3 份快照，逐对比较 + 最新快照 vs 当前

=== 基线 @ 11-09 15:00:01  →  开启后 @ 11-09 15:04:22 ===
监管: (无) → 1

[ConfigurationProfiles]
  + CloudConfigurationDetails.plist (612 B)
  cloud.IsSupervised: (无) → 1
  cloud.IsMandatory: (无) → 1
  cloud.OrganizationName: (无) → Test Organization
  cloud.ConfigurationURL: (无) → https://mdm.invalid/profile

[DeviceManagement]
  + CloudConfigurationDetails.plist (612 B)
  clientTruth.IsSupervised: (无) → 1

=== 开启后 @ 11-09 15:04:22  →  清除后 @ 11-09 15:09:40 ===
监管: 1 → (无)

[ConfigurationProfiles]
  − CloudConfigurationDetails.plist (412 B)
  cloud.IsSupervised: 1 → (无)
  ...
```

diff 只报**结构变化**（新增 `+` / 删除 `−` / 大小变化 `~`）和**字段值变化**；不比较 mtime，避免 `profiled` 顺手改动造成的噪声。快照文件在 `Documents/snapshots/`，开了 `UIFileSharingEnabled`，可直接用「文件」App 拷出来存档或对比历史。

