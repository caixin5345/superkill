          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" build/out/Payload/SuperKill.app/Info.plist || true
          cd build/out && zip -qry SuperKill-unsigned.ipa Payload
          ls -lh SuperKill-unsigned.ipa

