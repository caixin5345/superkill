name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      APP_GROUP: group.cc.replace.superkill
      BUNDLE_ID: cc.replace.superkill
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译并打包（未签名）
        run: bash scripts/build_ipa.sh

      - name: 列出产物
        run: ls -lh build/out

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperKill-unsigned-ipa
          path: build/out/*.ipa
          if-no-files-found: error
