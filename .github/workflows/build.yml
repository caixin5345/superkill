## 4. 出包

### 4.0 从零到装进手机（Windows 可用）

**路径 1：网页上传，零工具（最省事）**

1. github.com → New repository → 名字随意（如 `superkill`）→ Create
2. 进入空仓库 → **uploading an existing file** → 把 `supervision-killer/` **里面的内容**（`Sources/`、`Resources/`、`Entitlements/`、`scripts/`、`.github/`、`project.yml`、`Makefile`、`README.md`）整个拖进去 → Commit
   - 关键：`.github/` 必须在仓库根目录，否则 Actions 找不到 workflow
3. 仓库顶部 **Actions** → 左侧 **build-ipa** → **Run workflow**（推上去时可能已自动跑一次）
4. 约 3 分钟 → 运行页底部 **Artifacts** → 下载 `SuperKill-unsigned-ipa.zip` → 解压得到 `SuperKill-unsigned.ipa`
5. 传进手机（文件 App / AirDrop / 局域网）→ 用 ESign 签（见下）

**路径 2：一条命令，token 驱动（本机装了 Python 就行）**

```bash
# classic token 勾 repo + workflow；fine-grained 需要 Administration/Contents/Actions/Workflows 读写
python scripts/push_and_build.py --token ghp_xxxxxxxx --repo superkill
# 建仓 → 上传 → 触发 workflow → 等构建 → 自动下载解压
# 产物：build/ipa/SuperKill-unsigned.ipa
```

**路径 3：装好 git 后常规推**

```bash
cd supervision-killer      # 这一层必须是仓库根（.github/ 在这里）
git init -b main && git add . && git commit -m "SuperKill"
git remote add origin https://github.com/<你的账号>/superkill.git
git push -u origin main    # push 即触发 build-ipa
```

签名前确认三件事，缺一个都装不上或跑不起来：

1. profile 的 App ID 与 ipa 的 bundle id 对得上（`cc.replace.superkill` 或你自己改的值）
2. profile 里真的勾了 App Groups（免费 Apple ID 没有这个能力）
3. ESign 的 entitlements 编辑器里有：

```xml
<key>com.apple.security.application-groups</key>
<array><string>group.yourteam.superkill</string></array>
```

装好后打开 App，① 自检里 `Group 容器` 应为“可访问”。App 会通过 `xpc_copy_entitlement_for_self` 自动从自己的签名里读出 group，不需要手输；万一读不到（例如 entitlements 被签名工具剥掉），才需要在顶部输入框里手动填。

### 4.1 路线 A：Xcode 真机（最省事）

有 Mac 就不用管 CI / token / 未签名 ipa / ESign 这一整套：Xcode 会自动注册 App Group、生成描述文件、签名并安装。

1. `brew install xcodegen && cd supervision-killer && xcodegen generate && open SuperKill.xcodeproj`
2. Xcode → target `SuperKill` → **Signing & Capabilities**
   - Team 选你的付费团队，Bundle Identifier 改成你自己的（例如 `com.yourname.superkill`）
   - `+ Capability` → **App Groups** → 新建 `group.com.yourname.superkill` 并勾选
   - Xcode 会把该 group 写进 `Entitlements/SuperKill.entitlements`，不用手改
3. 连真机 → ⌘R 直接装上去跑
4. 想留一份 ipa：Product → Archive → Distribute App → Development / Ad Hoc

前提：Xcode 要新到能识别 iOS 26 设备（Xcode 26 及以上）；老版本 Xcode 会在“准备设备”阶段拒绝 iOS 26 真机。工程的最小系统版本是 17.0，与 SDK 无关。

Xcode 是唯一能自动帮你注册 App Group + 生成描述文件的工具，这也是路线 A 推荐的原因。

### 4.2 路线 B：CI 出未签名 IPA，自己重签

```bash
# 本机（macOS）：
APP_GROUP=group.com.yourname.superkill BUNDLE_ID=com.yourname.superkill ./scripts/build_ipa.sh

# 或者把仓库推到 GitHub，手动触发 build-ipa workflow，
# 下载 artifact：SuperKill-unsigned-ipa
```

拿到 `SuperKill-unsigned.ipa` 后重签（**必须带 App Group，否则 App 里第 ① 步就会报 `code -1`**）：

```bash
./scripts/sign_local.sh SuperKill-unsigned.ipa \
  "Apple Development: Your Name (TEAMID)" \
  ~/Downloads/SuperKill_Dev.mobileprovision \
  group.com.yourname.superkill

xcrun devicectl device install app --device <UDID> Payload/SuperKill.app
```

用 ESign / Feather / Sideloadly 也可以，但要在签名界面把 entitlements 改成：

```xml
<key>com.apple.security.application-groups</key>
<array><string>group.com.yourname.superkill</string></array>
```

并且**描述文件里必须真的包含这个 group**（门户 → Identifiers → App Groups 注册 → 关联到 App ID → 重新生成 profile）。免费 Apple ID 无法使用 App Groups，这一步绕不过去。

### 4.3 路线 C：Theos

```bash
export THEOS=~/theos
cd supervision-killer && make package install
```

`Makefile` 里已经把 `-SEntitlements/SuperKill.entitlements` 传给 `ldid`；同样要求 group 在本机/设备上可用（TrollStore 不支持 iOS 26，所以仍然只能靠带 group 的签名）。

### 4.4 App Group 注册（门户操作）

1. developer.apple.com → Certificates, Identifiers & Profiles → **Identifiers** → 右上角 `+` → **App Groups** → 填 `group.com.yourname.superkill`
2. 回到 **App IDs** → 你的 App ID → Capabilities → 勾 **App Groups** → Configure → 选中刚建的组
3. **Profiles** → 重新生成 Development profile（旧的没有 group 权限）
4. 下载 `.mobileprovision`，连同 `.p12` 一起用于重签

