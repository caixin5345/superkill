## 3. 工程结构

```
supervision-killer/
├── project.yml                        XcodeGen 工程描述（主构建入口）
├── Makefile                           Theos 构建（备选）
├── Sources/
│   ├── worse_query.h/.m               逃逸原语（自动尝试两组 flags、统一错误码、自动清理符号链接）
│   ├── SKEngine.h/.m                  监管检测 / 备份 / 清除 / 补丁 / 开启监管 / 快照与 diff / 回滚
│   ├── SKMainViewController.h/.m      操作台 UI
│   ├── SKAppDelegate.h/.m
│   └── main.m
├── Resources/Info.plist               SKAppGroup = $(SK_APP_GROUP)
├── Entitlements/SuperKill.entitlements 必须换成你自己的 App Group
├── scripts/build_ipa.sh               一键出 unsigned IPA
├── scripts/push_and_build.py          token 驱动：建仓 + 推送 + 触发 CI + 拉回 ipa
├── scripts/sign_local.sh              macOS 本地重签（注入 entitlements）
└── .github/workflows/build.yml         macOS runner 出包
```

