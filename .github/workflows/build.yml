          SK_EOF_09_INFO_PLIST
          mkdir -p Entitlements
          cat > Entitlements/SuperKill.entitlements <<'SK_EOF_10_SUPERKILL_ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<!-- 必须替换成你在开发者门户注册、并已勾进描述文件的 App Group -->
          	<key>com.apple.security.application-groups</key>
          	<array>
          		<string>group.cc.replace.superkill</string>
          	</array>
          </dict>
          </plist>
          SK_EOF_10_SUPERKILL_ENTITLEMENTS
          cat > project.yml <<'SK_EOF_11_PROJECT_YML'
          name: SuperKill
          options:
            bundleIdPrefix: cc.replace
            createIntermediateGroups: true
            deploymentTarget:
