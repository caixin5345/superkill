## 6. 错误码

| 返回 | 含义 | 处理 |
|---|---|---|
| `-1` | App Group 不存在 | 签名没带 `com.apple.security.application-groups`，或 group 未在门户注册/未勾进 profile |
| `-2` | 符号解析失败 | 系统版本不在窗口期，或 `libsystem_containermanager.dylib` 路径变了 |
| `-3` | query 创建失败 | 极少见，重试 |
| `-4` | 符号链接创建失败 | 容器里 `Library/Caches` 权限异常，删掉 App 重装 |
| `-5` | containermanagerd 拒绝 | flags/part 与系统不匹配（本工程已自动试两组 flags） |
| `-6` | 内核拒绝签发扩展 | 目标路径不在可签发范围，或 token 被拒 |
| `-255` | 目标不存在 | 该设备没有这个目录（例如未注册 MDM 就没有 `DeviceManagement`） |

---

## 7. 限制（务必看）

1. **不是永久解**。ABM / DEP（Apple Business Manager、Apple School Manager）注册的设备，联网激活时 `cloudconfigurationd` 会从 Apple 拉回监管记录；抹机、系统更新同样会回滚。非 DEP 的“Apple Configurator 手搓监管”设备，清除后一般能长期保持。
2. **管理端会发现**。MDM 侧表现为设备停止 check-in；温和补丁模式下 profile 仍在但服务器地址已指向黑洞。
3. **版本窗口**。原语只覆盖 iOS 26.0–26.7.2 / 27.2；更高版本随时可能被修掉（`container_query` 里加 `realpath` 校验即可）。
4. **需要付费账号**。App Groups 是免费账号拿不到的能力，这是整条链上唯一无法用技术手段绕过的门槛。
5. **别在清除前联网**。删完立刻联网 + MDM 服务器主动推 profile，可能当场回滚；先飞行模式，重启后再联网。
6. **不做全盘抹除**。本工具只动配置与状态文件，不动用户数据。

---

## 8. 回滚

- App 内“⑥ 回滚最新备份”会把 `Documents/backups/<最新>/` 覆盖回三个目录。
- 备份目录结构：`backups/<时间戳>/<序号>-<目录名>/…` + `roots.plist`（记录 slug → 原始路径）。
- 彻底清除后如果没有备份：抹机重装是唯一的“还原”方式（监管状态由服务器决定，抹机后 DEP 设备会重新被监管）。

---

## 9. 没有开发者账号时的备选路线

| 路线 | 做法 | 代价 |
|---|---|---|
| 备份改写（无需漏洞） | iMazing / Apple 配置工具建本地备份 → 编辑 `SysSharedContainerDomain-systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles` → 删 `MDM.plist`、`MDMEvents.plist`、`CloudConfigurationDetails.plist` → 还原备份 | 需要还原备份，耗时；对 DEP 无效 |
| 越狱 + Filza | 直接改第 2 节那批文件（jailbreak 下无沙盒限制） | iOS 26 目前没有公开越狱 |
| MDM 官方移除 | 让管理方在 ABM/MDM 后台 “Release” 设备 | 需要管理方配合 |

---

